<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Film, dizi ve kitap versucheri">
<title>versucher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Alegreya ve Bitter'in italik kesimleri istenmedi: sitede italik kullanilmiyor
     (3) ve italic varyantlari yuklemek gereksiz bayt. -->
<link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&family=Alegreya:wght@700&family=Bitter:wght@400;700&family=Manrope:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Ayni renk ailesinin aydinligi: parsomnen zemin, murekkep metin, koyu pirinc */
  --bg:#E9E4D3;--panel:#F2EEE0;--raise:#FBF8EE;--well:#DFD9C5;--line:#CFC7AE;
  --text:#1F1D18;--muted:#625E4A;--accent:#7E5F2F;--star:#8A6E3C;--link:#6E5426;--link-hi:#9A7630;
  --sh1:rgba(60,48,26,.22);--sh2:rgba(60,48,26,.11);--hi:rgba(255,255,255,.75);
  --ledge-a:#CFC7AE;--ledge-b:#B9AF94;--line-ctl:#ADA389;
  --cover:#EAE5D4;--cover-frame:rgba(31,29,24,.3);--sk:rgba(31,29,24,.055);
  --head:'Alegreya',Georgia,'Times New Roman',serif;
  /* Site basligi ("more art") icin. Google Fonts'ta tek agirligi (400) var. */
  --brand:'Manufacturing Consent','Alegreya',Georgia,serif;
  --body:'Bitter',Georgia,'Times New Roman',serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --type:'Courier Prime','Courier New',Courier,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    /* Grafit siyahi / soluk kemik / eski pirinc */
    --bg:#0F0F10;--panel:#18181A;--raise:#1E1E22;--well:#0A0A0B;--line:#26262A;
    --text:#E3DEC3;--muted:#8A8778;--accent:#C5A880;--star:#B29572;--link:#D4B98C;--link-hi:#F3DFB4;
    --sh1:rgba(0,0,0,.72);--sh2:rgba(0,0,0,.45);--hi:rgba(227,222,195,.07);
    --ledge-a:#2E2E33;--ledge-b:#1A1A1D;--line-ctl:#5E5E66;
  --cover:#1B1B1F;--cover-frame:rgba(227,222,195,.24);--sk:rgba(227,222,195,.07);
    --cover:#1B1B1F;--cover-frame:rgba(227,222,195,.24);--sk:rgba(227,222,195,.07);
  }
}
:root[data-theme="dark"]{
  /* Grafit siyahi / soluk kemik / eski pirinc */
  --bg:#0F0F10;--panel:#18181A;--raise:#1E1E22;--well:#0A0A0B;--line:#26262A;
  --text:#E3DEC3;--muted:#8A8778;--accent:#C5A880;--star:#B29572;--link:#D4B98C;--link-hi:#F3DFB4;
  --sh1:rgba(0,0,0,.72);--sh2:rgba(0,0,0,.45);--hi:rgba(227,222,195,.07);
  --ledge-a:#2E2E33;--ledge-b:#1A1A1D;--line-ctl:#5E5E66;
  --cover:#1B1B1F;--cover-frame:rgba(227,222,195,.24);--sk:rgba(227,222,195,.07);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
/* 3) Sitede hicbir metin italik olmayacak. Kaynaklarda zaten tek italik
   kullanimi vardi (site basligi) ve kaldirildi; bu genel kural, gelecekte
   <em>/<i> eklenirse ya da tarayici sentetik italik uretirse onu da engeller. */
em,i,cite,dfn,var,address{font-style:normal}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.65;font-size:16px}
button,input,select{font:inherit;color:inherit}
/* 1) Baglantilar: alti cizgi YOK, uzerine gelince renk degisir. --link-hi her
   iki temada da --link'ten belirgin sekilde parlak; odunu satiri gibi duran
   baglantilari (film/dizi/kitap raf karti basliklari) ayirt etmek icin de
   kullanilir: normalde duz metin, uzerine gelince pirinc. */
a{color:inherit;text-decoration:none}
a:hover{color:var(--link-hi)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{position:relative;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 6px 20px var(--sh2)}
/* Baslik, nav ve sagdaki dugmeler TEK satirda. nav daralan ekranda kayar
   (overflow-x:auto) ki dugmeler asla alt satira dusmesin. */
.bar{display:flex;align-items:center;gap:1.1rem;max-width:1100px;margin:0 auto;padding:.9rem 1.25rem}
/* Baslik ve nav TABAN CIZGISINE gore hizalanir, kutu ortasina gore degil.
   align-items:center sadece kutulari ortalar; baslik 28px, nav linkleri 14.4px
   oldugu icin taban cizgileri 8.8 px kayik duruyordu (metin tabani 53'e karsi
   44.2). align-self:baseline bu kaymayi kaldirir. Iki dugme ortalanmis kalir. */
.bar>.mark,nav{align-self:baseline}
/* Site basligi: "more art", Manufacturing Consent, kalin.
   Font yalnizca 400 agirlikta yayinlandigi icin 700 istegi tarayiciya
   "sentetik kalin" yaptirir; text-stroke kalinligi keskinlestirir.
   font-style:normal: sitede hicbir yerde italik yok (3). */
.mark{font-family:var(--brand);font-weight:700;font-style:normal;font-size:1.75rem;line-height:1.15;background:none;border:0;cursor:pointer;padding:0;letter-spacing:.02em;text-decoration:none;-webkit-text-stroke:.014em currentColor;text-stroke:.014em currentColor;white-space:nowrap;flex:none}
/* Arama dugmesi ve tema dugmesi ayni boyda olsun: ikisi de .ghost. Once
   yukseklikleri farkliydi (line-height 1.1 / 1.65). Sabit yukseklik +
   flex ortalama ikisini de birebir esitler. */
.ghost{font-family:var(--ui);font-size:.82rem;line-height:1;background:var(--well);border:1px solid var(--line-ctl);color:var(--muted);height:2.15rem;padding:0 .8rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:3px;box-shadow:inset 0 2px 3px var(--sh2);transition:color .15s,border-color .15s}
.ghost:hover{color:var(--text)}
nav{display:flex;gap:1.15rem;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
nav::-webkit-scrollbar{display:none}
/* Dar ekranda baslik ve iki dugme yer kaplayinca nav'a ~140px kaliyordu.
   Kucultuluyor: nav kaydirilabilir kalsin ama en az iki link gorunsun.
   Iki dugme ayni olcekte kalir (ikisi de .ghost kuralini paylasiyor). */
@media (max-width:640px){
  .bar{gap:.55rem;padding:.7rem .8rem}
  .mark{font-size:1.35rem}
  .ghost{height:1.95rem;padding:0 .55rem;font-size:.74rem}
  .search-btn-txt{display:none}
  nav{gap:.9rem}
}
nav a{font-family:var(--ui);font-weight:600;font-size:.9rem;color:var(--link);padding:.55rem 0;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex:none}
nav a:hover{color:var(--link-hi)}
nav a[aria-current="page"]{color:var(--link)}
nav a[aria-current="page"]{border-bottom-color:var(--accent)}
.note{font-family:var(--ui);width:min(1100px,calc(100% - 1.5rem));margin:1.1rem auto 0;color:var(--muted);font-size:.8rem;line-height:1.5}
.note.is-error{color:#e0a3a3}
.note[hidden]{display:none}
.site-foot{width:min(1100px,calc(100% - 1.5rem));margin:0 auto;padding:.9rem 0 2.5rem;font-family:var(--ui);font-size:.76rem;line-height:1.5;color:var(--muted);border-top:1px solid var(--line)}
.spinner{width:15px;height:15px;flex:none;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.sk{animation:none;background:none}}
main{width:min(1100px,calc(100% - 1.5rem));margin:1rem auto 3rem;padding:1.5rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 1px 0 var(--hi),0 2px 4px var(--sh1),0 22px 44px -8px var(--sh1)}
main:has(.detail-page){width:min(1100px,calc(100% - 1.5rem))}
/* Yukseklikten hesaplanan daraltma yalnizca genis ekranda: kisa/kucuk ekranda
   sayfayi sikistirip kenarlarda buyuk bosluk birakiyordu. */
@media (min-width:701px){main:has(.detail-page){width:min(1100px,calc(100% - 1.5rem),calc((100vh - 185px) * 1.3334 + 75px))}}
@media (max-width:520px){main{padding:1.1rem}}
h1,h2{font-family:var(--head);font-weight:700;margin:0}
h1{font-size:2.1rem;line-height:1.2}
h2{font-size:1.4rem;line-height:1.25}
h3{font-family:var(--head);font-size:1.15rem;line-height:1.3;margin:0}
p{margin-top:.55rem}
.sub{font-family:var(--ui);color:var(--muted);font-size:.85rem;margin:.2rem 0 0}
.eyebrow{font-family:var(--ui);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 .35rem}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:2.2rem 0 .9rem}
.sh:first-child{margin-top:0}
.link{font-family:var(--ui);font-weight:600;font-size:.85rem;color:var(--link);cursor:pointer;padding:0}
.welcome{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:1.2rem 1.35rem;box-shadow:inset 0 1px 0 var(--hi)}
.welcome p{max-width:62ch}
.ctl{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.1rem 0 1.6rem}
.ctl input,.ctl select{font-family:var(--ui);font-size:.88rem;background:var(--well);border:1px solid var(--line-ctl);color:var(--text);padding:.5rem .7rem;border-radius:3px;box-shadow:inset 0 2px 5px var(--sh1)}
.ctl input{flex:1 1 200px;max-width:320px}
/* Tek izgara sistemi. Once 6 sutundu; kartlar kucuk kaldigi icin 4'e
   indirildi. Playlist kartlari kare (aspect-ratio:1/1) ve daha genis
   durmasi daha iyi gorundugu icin 3 sutunda. */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.7rem 1.3rem}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grid,.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem .7rem}}
.niche{background:var(--well);border-radius:4px;padding:1.2rem 1.1rem;overflow:hidden;box-shadow:inset 0 10px 18px -6px var(--sh1),inset 0 -1px 0 var(--hi)}

/* Buyuk kartin yazilari da buyusun; afis yokken gosterilen baslik dahil. */
.niche .cap{font-size:.95rem}
.niche .pl-name{font-size:1rem}
.niche .pc{font-size:.86rem}
.niche .cover .ct{font-size:1.3rem}
.niche .cover .cy{font-size:.8rem}
.niche::after{content:"";display:block;height:11px;margin:0 -1.1rem;background:linear-gradient(var(--ledge-a),var(--ledge-b));border-top:1px solid var(--hi);box-shadow:0 -8px 12px -8px var(--sh1)}
.poster-card{min-width:0;content-visibility:auto;contain-intrinsic-size:auto 300px}
.poster{position:relative;display:block;text-decoration:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;transition:transform .15s}
.poster:hover{transform:translateY(-4px)}
/* Raf kartı basligi odun rengiyle duz metin gibi duruyordu; uzerine gelince
   --link-hi ile one cikiyor (alt cizgi kullanmiyoruz).

   Kapsayici .poster-card (article) OLMALI. Playlist basligi .pl-name,
   <a class="poster"> KAPESININ DISINDA duruyor: poster() sirasi su:
     <article class="poster-card"><a class="poster">kapak</a><div class="cap">baslik</div></article>
   .poster:hover .pl-name bu yuzden HIC ESLESMIYORDI. .poster-card ikisini
   de kapsar -> kartin herhangi bir yerine gelince baslik one cikar.

   (.cover-name diye bir sinif sitede hic yok; kesilmis bir secikti, silindi.) */
.poster-card:hover .pl-name{color:var(--link-hi)}
.cover{position:relative;aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1.1rem .9rem;color:#E9E4D8;border-radius:2px;overflow:hidden;background:var(--cover);box-shadow:0 1px 2px rgba(0,0,0,.6),0 10px 18px -4px rgba(0,0,0,.5);transition:box-shadow .15s}
.poster:hover .cover{box-shadow:0 2px 4px rgba(0,0,0,.6),0 18px 26px -4px rgba(0,0,0,.55)}
.cover::before{content:"";position:absolute;inset:8px;border:1px solid var(--cover-frame);pointer-events:none;z-index:2}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,0) 7%,rgba(0,0,0,.2));pointer-events:none;z-index:2}
.cover img{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:var(--well)}
.cover-fallback{position:relative;z-index:0;max-width:100%;overflow-wrap:anywhere}
.cover .ct{font-family:var(--head);font-weight:700;font-size:1.1rem;line-height:1.25}
.cover .cy{font-family:var(--ui);position:absolute;bottom:14px;left:14px;right:14px;text-align:center;font-size:.72rem;color:rgba(233,228,216,.72);z-index:3}
/* Baslik ancak gorsel boyandiktan sonra gizlenir. */
.cover.has-image.is-loaded .cover-fallback{display:none}
.sk{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(100deg,transparent 18%,var(--sk) 45%,transparent 72%);background-size:260% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{from{background-position:170% 0}to{background-position:-70% 0}}
.cover:not(.has-image) .sk{display:none}
.cover.has-image.is-loaded .sk{display:none}
.cover.has-image::before{border-color:rgba(255,255,255,.32)}
.pal0{background:linear-gradient(#4a1b28,#25101a)}
.pal1{background:linear-gradient(#1f3a44,#0f1e26)}
.pal2{background:linear-gradient(#372b4d,#191226)}
.pal3{background:linear-gradient(#4a3a28,#241a10)}
.pal4{background:linear-gradient(#2c4237,#122019)}
.pal5{background:linear-gradient(#43303a,#20141b)}
.badge{position:absolute;top:14px;left:14px;z-index:4;font-family:var(--ui);font-weight:600;font-size:.65rem;padding:.1rem .45rem;background:rgba(0,0,0,.55);border:1px solid rgba(233,228,216,.35);color:#E9E4D8;border-radius:2px}
.cap{font-family:var(--ui);margin-top:.55rem;font-size:.9rem;color:var(--muted);text-align:center}
.st{color:var(--star);letter-spacing:.05em;white-space:nowrap}
/* "Son okunanlar" / "Son izlenenler" kartlarinda tarih satiri. Yildiz
   puaninin altinda, ayni .cap icinde. */
.cap-date{display:block;margin-top:.2rem;font-size:.78rem;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
/* "Rastgele" bolumunde Karisik modda kartin tur etiketi. .eyebrow ile ayni
   dilde (buyuk harf, pirinc, kalin) ama kart icin daha kucuk. */
.cap-kind{display:block;margin-bottom:.15rem;font-family:var(--ui);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
/* "Rastgele" secici + Yeniden cek dugmesi. secili olan dolu arka planla
   belirgin; hover GEREKMEZ, yani dokunmatik/mobilde de secim gorunur. */
.seg{display:inline-flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.seg button{font-family:var(--ui);font-size:.76rem;line-height:1.4;color:var(--link);background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:.24rem .55rem;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi);transition:color .15s,border-color .15s,background .15s}
.seg button:hover{border-color:var(--link-hi);color:var(--link-hi)}
.seg button[aria-pressed="true"]{background:var(--link);border-color:var(--link);color:var(--text);font-weight:700}
.seg .seg-redraw{margin-left:.2rem;color:var(--muted)}
.seg .seg-redraw:hover{color:var(--link-hi)}
.pc{display:block;color:var(--muted);white-space:nowrap;letter-spacing:.02em;font-size:.85rem;margin-top:.2rem}
.listen-btn{display:inline-block;font-family:var(--ui);font-size:.92rem;font-weight:600;padding:.6rem 1.15rem;border:1px solid var(--link);border-radius:3px;color:var(--link);background:var(--raise);transition:background .15s,color .15s,border-color .15s}
.listen-btn:hover{border-color:var(--link-hi);color:var(--link-hi)}
.listen-btn:hover{background:var(--link);color:var(--text)}
@media (prefers-reduced-motion:reduce){.poster,.cover{transition:none}.poster:hover{transform:none}}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.4rem}
.favs section{background:var(--raise);border-radius:4px;padding:1rem 1.2rem 1.1rem;box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh1),0 10px 20px -6px var(--sh1)}
.favs h2{font-size:1.2rem;border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.6rem}
.favs ul{list-style:none;margin:0;padding:0}
.favs li{padding:.2rem 0}
.shelf{list-style:none;margin:0;padding:0;columns:2 240px;column-gap:2.5rem}
.shelf li{break-inside:avoid}
.shelf a{font-family:var(--ui);font-weight:600;display:flex;justify-content:space-between;width:100%;color:var(--link);border-bottom:1px solid var(--line);padding:.6rem 0}
.shelf a:hover{color:var(--link-hi);border-bottom-color:var(--link-hi)}
.shelf span:last-child{color:var(--muted);font-weight:400}
.empty{font-family:var(--ui);color:var(--muted);padding:2rem 0}
.loading:not(:has(.spinner)){font-family:var(--ui);color:var(--muted);padding:2rem 0}
.back{font-family:var(--ui);font-size:.85rem;color:var(--link)}
.detail-page{--gap:25px;font-size:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;row-gap:1.25rem}
/* Detay sayfasinda onceki/sonraki oklari: ekranin sol ve sag kenarinda,
   dikeyde ortada. Sag ok sonraki kayda, sol ok onceki kayda gider. */
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:66px;display:flex;align-items:center;justify-content:center;font-size:2.3rem;line-height:1;text-decoration:none;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 4px var(--sh1),0 10px 20px -8px var(--sh1);transition:border-color .15s,color .15s}
.nav-arrow.prev{left:10px}
.nav-arrow.next{right:10px}
.nav-arrow:hover{border-color:var(--link-hi);color:var(--link-hi)}
@media (max-width:700px){.nav-arrow{width:34px;height:50px;font-size:1.7rem}.nav-arrow.prev{left:4px}.nav-arrow.next{right:4px}}
@media (prefers-reduced-motion:reduce){.nav-arrow{transition:none}}
.detail-heading{grid-column:1/-1;margin:0;padding:0;min-width:0}
.detail-heading h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.15;overflow-wrap:anywhere}
.detail-subline{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-top:.5rem;color:var(--muted);font-family:var(--ui);font-size:30px;line-height:1.3}
.detail-subline .link-chip{font-size:1em;color:var(--muted);cursor:pointer}
.detail-subline .link-chip:hover{color:var(--text);border-bottom-color:var(--line)}
.detail-split{display:contents}
.detail-art-column{grid-column:1;position:sticky;top:1rem;align-self:start;min-width:0;padding:0 calc(var(--gap) / 2) 25px 0}
.detail-content{grid-column:2;position:relative;min-width:0;padding:0 0 0 calc(var(--gap) / 2)}
.detail-content::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line)}
.detail-top-info{min-width:0;margin-top:1rem}
.detail-art-column .cover{width:100%;max-width:none;box-shadow:0 2px 5px rgba(0,0,0,.55),0 20px 34px -10px rgba(0,0,0,.55)}
.detail-art-column .detail-top-info{text-align:center}
.detail-art-column .detail-top-info .main-label-row,.detail-art-column .detail-top-info .compact-links{justify-content:center}
.detail-series{font-family:var(--ui);font-size:.7em;font-weight:400;color:var(--muted);white-space:nowrap;margin-left:.35rem;vertical-align:middle}
.detail-content .detail-sections{margin-top:0}
.detail-score{font-family:var(--ui);font-size:.95rem;margin-top:1rem}
.detail-score .stars{font-size:1.35rem;color:var(--star);letter-spacing:.08em}
.main-label-row,.compact-links,.detail-value-chips{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.4rem;margin-top:.9rem}
.compact-links{margin-top:.75rem}
.tag-chip,.compact-link{display:inline-flex;align-items:center;align-self:flex-start;width:fit-content;max-width:100%;font-family:var(--ui);font-size:.76rem;line-height:1.3;color:var(--link);background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:.22rem .5rem;text-decoration:none;overflow-wrap:anywhere;box-shadow:inset 0 1px 0 var(--hi)}

const FAV_DIRECTORS_TOP=[

];
/* Coklu yazarli kitaplarda tek tek gosterilecek yazarlar; grubun digerleri gosterilmez. */
const FAV_MULTI_AUTHORS=['Demokan Atasoy','Galip Dursun','İşın Beril Tetik'];
/* Anasayfadaki playlist sirasi elle secildi; "main" kategorisinden bu sirayla. */
const HOME_PLAYLISTS=[
  'loşş salınım',"victoria's spell",'alice in angerland',"sade'ın kırbacı",
  'astral çürüme','hiç ışık yok','ebedi döngü','depedehşet',

];

const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\r/g,'').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
const missing=s=>{const v=clean(s);return !v||/^[-–—]+$/.test(v)};
const trFormat=n=>Number.isFinite(n)?String(n).replace('.',','):'';
const isLocal=location.protocol==='file:';
function detectAppBase(){
  if(isLocal)return '';
  const parts=location.pathname.split('/').filter(Boolean);
  /* Bu liste, depo adini (orn. /arsiv) rotanin basindan ayirmak icin gereklidir.
     ROUTE_PREFIX ve sayfa adlari tutulmali; aksi halde /arsiv/playlist/... 404 sonrasi bozulur. */
  const known=[...Object.values(ROUTE_PREFIX),'films','series','books','concerts','favs','enler','lists','etiket','tur','ara','yazarlar','yonetenler']
    .map(part=>part.toLocaleLowerCase('tr-TR'));
  const routeIndex=parts.findIndex(part=>known.includes(part.toLocaleLowerCase('tr-TR')));
  if(routeIndex===0)return '/';
  if(routeIndex>0)return '/'+parts.slice(0,routeIndex).join('/')+'/';
  const last=parts[parts.length-1]||'';
  if(last.includes('.'))return '/'+parts.slice(0,-1).join('/')+(parts.length>1?'/':'');
  /* Depo altinda yayin (orn. https://<kullanici>.github.io/arsiv/): ilk segment depo adidir. */
  return parts.length?'/'+parts.join('/')+'/':'/';
}
const APP_BASE=detectAppBase();
const main=$('#main');

function numberValue(value){
  const m=clean(value).match(/[+-]?\d+(?:[.,]\d+)?/);
  return m?Number(m[0].replace(',','.')):null;
}
function integerValue(value){const n=numberValue(value);return n==null?null:Math.round(n)}
function yearValue(value){const m=clean(value).match(/(?:18|19|20|21)\d{2}/);return m?Number(m[0]):null}
function stars(value){
  const n=numberValue(value);if(n==null)return '';
  const half=Math.round(n)/2,full=Math.floor(half),rest=half-full;
  return '★'.repeat(full)+(rest>=.4?'½':'');
}
function scoreHtml(item){
  return item.score==null?'—':`<span class="stars">${esc(stars(item.score))}</span>`;
}
function splitList(value){
  return clean(value).split(/\s*(?:\/\/|,|;)\s*/).map(clean).filter(v=>!missing(v));
}
function safeUrl(value){
  const v=clean(value);
  if(/^https?:\/\//i.test(v))return v;
  if(/^\/\//.test(v))return 'https:'+v;
  if(/^(?:www\.|themoviedb\.org\/)/i.test(v))return 'https://'+v;
  if(/^(?:\.{0,2}\/)/.test(v))return v;
  return '';
}
/* slugPart saf bir fonksiyon ama rotaValues() her deger icin tum kardesleri
   taradigi icin yuz binlerce kez cagriliyordu. Onbellek sayesinde O(n). */
const _slugCache=new Map();
function slugPart(value){
  const key=String(value);
  if(_slugCache.has(key))return _slugCache.get(key);
  const out=slugPartRaw(key);
  _slugCache.set(key,out);
  return out;
}
function slugPartRaw(value){
  let s=clean(value).toLocaleLowerCase('tr-TR');
  const map={'ğ':'g','Ğ':'g','ı':'i','İ':'i','ö':'o','Ö':'o','ç':'c','Ç':'c','ş':'s','Ş':'s','ü':'u','Ü':'u','ø':'o','æ':'ae','œ':'oe','ß':'ss','ð':'d','þ':'th','ł':'l','đ':'d','³':'3','²':'2'};
  s=s.replace(/[ğĞıİöÖçÇşŞüÜøæœßðþłđ³²]/g,c=>map[c]).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[’'`´]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return s;
}
function filmName(item){
  const pre=clean(item.pre),title=clean(item.title);
  if(pre&&!title.toLocaleLowerCase('tr-TR').startsWith((pre+' ').toLocaleLowerCase('tr-TR')))return pre+' '+title;
  return title||pre;
}
function displayName(item){return item.sec==='films'?filmName(item):clean(item.title)}
function dateSort(value){
  const s=clean(value).toLocaleLowerCase('tr-TR');
  const months={ocak:0,şubat:1,subat:1,mart:2,nisan:3,mayıs:4,mayis:4,haziran:5,temmuz:6,ağustos:7,agustos:7,eylül:8,eylul:8,ekim:9,kasım:10,kasim:10,aralık:11,aralik:11};
  let m=s.match(/(\d{1,2})\s+([a-zçğıöşü]+)\s+(\d{4})/i);
  if(m&&months[m[2]]!=null)return Date.UTC(Number(m[3]),months[m[2]],Number(m[1]));
  /* 13.06.2026 -> gun/ay/yil. Film sayfasindaki "izleme tarihi" bu bicimde. */
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if(m)return Date.UTC(Number(m[3]),Number(m[2])-1,Number(m[1]));
  m=s.match(/(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?/);
  if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]||1));
  const y=yearValue(s);return y?Date.UTC(y,0,1):-Infinity;
}
/* ------------------------------------------------------------------ *
 * Veri katmanı
 * Veri, GitHub Actions tarafından üretilen data/*.json dosyalarından
 * okunur. Tarayıcı Google Sheets'e bağlanmaz. İstekler no-cache'dir.
 * ------------------------------------------------------------------ */

const D={films:[],series:[],books:[],playlists:[]};
let REG=new Map();
const state={route:parseRoute(),q:'',sort:'date',min:0,genre:'',status:'',cat:'',page:1};
/* Bir sayfada gosterilen kayit sayisi. */
const PAGE_SIZE=30;

function totalPages(total){return Math.max(1,Math.ceil(total/PAGE_SIZE))}
function pagerHtml(total,view,current){
  const pages=totalPages(total);
  if(pages<2)return '';
  const parts=[];
  const add=p=>parts.push(p===current
    ?`<span class="pager-cur" aria-current="page">${p}</span>`
    :`<a href="${esc(hrefFor('/'+view+'/'+p))}" data-route="/${view}/${p}">${p}</a>`);
  for(let p=1;p<=pages;p++)add(p);
  return `<nav class="pager" aria-label="Sayfalar">${parts.join('')}</nav>`;
}
/* Sonsuz kaydirma kaldirildi: asagi indikce sonraki 30 kayit otomatik
   eklenmiyor. Sayfalama yalnizca #pager (pagerHtml) ile yapiliyor; o zaten
   her zaman vardi ve state.page'i dogrudan adresten okuyor (/kitap/2). */
let dataMeta={generatedAt:'',error:''};

/* JSON'dan gelen kayıtta türetilmiş alanları hesaplar. */
/** Arama dizini ve sorgu icin kucuk harf + Turkce aksan indirgemesi.
 *  Gerekli: `toLocaleLowerCase('tr-TR')` tek basina "Isaac" -> "ısaac" yapar,
 *  boylece kullanici "isaac" yazdiginda sonuc gelmezdi. Burada ı->i, ş->s,
 *  ğ->g, ö->o, ü->u, ç->c indirgemesi yapilir; "Isaac", "isaac" ve "İsaac"
 *  ayni kayda gider.
 *  Birlesik isaretler de atilir: "İ".toLocaleLowerCase('tr-TR') = "i"+U+0307
 *  dondugu icin "İngilizce" -> "i̇ngilizce" olurdu; NFD + birlesik isaret
 *  temizligi bunu "ingilizce" yapar. slugPart() ile ayni kural. */
function foldText(value){
  return String(value??'').toLocaleLowerCase('tr-TR')
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ö/g,'o').replace(/ü/g,'u').replace(/ç/g,'c')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function hydrate(item){
  item.genres=Array.isArray(item.genres)?item.genres:[];
  item.subgenres=Array.isArray(item.subgenres)?item.subgenres:[];
  item.directors=Array.isArray(item.directors)?item.directors:[];
  item.countries=Array.isArray(item.countries)?item.countries:[];
  item.displayTitle=displayName(item);
  item.searchText=[
    item.displayTitle,item.author,item.originalTitle,item.seriesName,item.mainLabel,item.reason,item.platform,
    item.altTitle,
    item.directorRaw,item.category,item.character,item.translator,item.publisher,item.formats,item.acquisition,
    item.authorOrigin,item.city,item.readLanguage,item.writtenLanguage,item.firstCity,item.directorOrigin,
    item.reasonFound,item.reasonWhy,
    item.watched,item.seriesOrder,item.creator,item.network,item.format,item.statusRaw,item.category,item.feeling,
    item.adaptation,
    item.countries.join(' '),item.genres.join(' '),item.subgenres.join(' ')
  ].filter(Boolean).join(' ');
  item.searchText=foldText(item.searchText);
  return item;
}
function applyData(next,meta){
  const all=[];
  Object.keys(D).forEach(type=>{D[type]=next[type]||[]});
  Object.values(D).flat().forEach(item=>{hydrate(item);all.push(item)});
  REG=new Map(all.map(item=>[item.id,item]));
  dataMeta=meta||{generatedAt:'',error:''};
  _genreCache=null;_siblingCache=new Map();
  render();
}
function totalCount(){return Object.values(D).reduce((sum,list)=>sum+list.length,0)}
function formatStamp(value){
  if(!value)return '';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '';
  try{return date.toLocaleString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).toLocaleLowerCase('tr-TR')+' (tsi)'}
  catch(_){return date.toISOString()}
}
/* Kayit sayisi ve guncelleme zamani alt bilgide birlikte gorunur. Ust bosluk
   (#data-status) artik YALNIZCA veri hatasi mesaji icindir; hata yokken
   hidden ile tamamen kaldirilir, yoksa bos bir margin boslugu birakir. */
function updateStatus(){
  const total=totalCount();
  const el=$('#data-status');
  if(el){
    el.textContent=dataMeta.error;
    el.hidden=!dataMeta.error;
    el.classList.toggle('is-error',!!dataMeta.error);
  }
  const foot=$('#data-footer');
  if(!foot)return;
  const files=Object.values(DATA_FILES).map(file=>file.split('/').pop()).join(' · ');
  if(dataMeta.error){foot.textContent=dataMeta.error;return}
  const stamp=formatStamp(dataMeta.generatedAt);
  const count=total?`${total.toLocaleString('tr-TR')} kayıt`:'';
  if(!total){foot.textContent=files;return}
  foot.textContent=`${count} · Son güncelleme tarihi: ${stamp||'—'}`;
}
async function loadData(){
  const types=Object.keys(DATA_FILES);
  const results=await Promise.all(types.map(async type=>{
    const controller=typeof AbortController==='function'?new AbortController():null;
    const timer=controller?setTimeout(()=>controller.abort(),20000):null;
    try{
      const options={cache:'no-store'};if(controller)options.signal=controller.signal;
      /* Dogrusal yol kullanmak yanlisti: /arsiv/film/bugonia-2025 yenilendiginde
         adres /arsiv/film/data/films.json oluyor ve 404 donuyordu. Taban adres eklendi. */
      const response=await fetch(dataUrl(DATA_FILES[type]),options);
      if(!response.ok)throw new Error('HTTP '+response.status);
      const payload=await response.json();
      if(!payload||!Array.isArray(payload.items))throw new Error('beklenen biçimde değil');
      return {type,items:payload.items,generatedAt:clean(payload.generatedAt),ok:true};
    }catch(error){return {type,message:error&&error.message?error.message:String(error),ok:false}}
    finally{if(timer)clearTimeout(timer)}
  }));
  const next={films:[],series:[],books:[],playlists:[]};
  const failed=[];
  let newest='';
  results.forEach(result=>{
    if(!result.ok){failed.push(`${result.type} (${result.message})`);return}
    next[result.type]=result.items;
    if(result.generatedAt&&(!newest||result.generatedAt>newest))newest=result.generatedAt;
  });
  if(failed.length===types.length){
    dataMeta={generatedAt:'',error:isLocal
      ?'Veri okunamadı: siteyi dosya olarak (file://) açmayın — data/ klasöründen okumak için bir HTTP sunucusu gerekir.'
      :'Veri dosyaları yüklenemedi — '+failed.join('; ')};
    render();
    return;
  }
  applyData(next,{generatedAt:newest,error:failed.length?`Bazı veri dosyaları okunamadı — ${failed.join('; ')}`:''});
}

/* SPA yönlendirme: yayınlanmış sitede adres /kitap/... olur; file: altında hash kullanılır. */
function hrefFor(path){
  if(isLocal)return '#'+path;
  return APP_BASE+String(path).replace(/^\//,'');
}
function parseRoute(){
  let pathname=location.pathname;
  if(!isLocal&&APP_BASE&&pathname.toLocaleLowerCase('tr-TR').startsWith(APP_BASE.toLocaleLowerCase('tr-TR'))){
    pathname='/'+pathname.slice(APP_BASE.length);
  }
  let raw=isLocal&&location.hash?location.hash.slice(1):pathname;
  raw=raw.split('?')[0].split('#')[0];
  let parts;
  try{parts=raw.split('/').filter(Boolean).map(part=>decodeURIComponent(part))}catch(_){parts=raw.split('/').filter(Boolean)}
  const first=parts[0]?.toLocaleLowerCase('tr-TR');
  const routeType=Object.keys(ROUTE_PREFIX).find(key=>ROUTE_PREFIX[key]===first);
  if(routeType&&parts[1]?.toLocaleLowerCase('tr-TR')==='filtre'&&parts[2]&&parts[3])return {kind:'filter',type:routeType,field:parts[2],valueSlug:parts.slice(3).join('/')};
  if(routeType&&parts[1])return {kind:'detail',type:routeType,slug:parts.slice(1).join('/')};
  /* Slug'siz /tur ve /etiket birer dizin sayfasidir; slug'li halleri tek tur /
     tek etiket listesidir. Once slug'li dal denenir. */
  if(first==='etiket'&&parts[1])return {kind:'tag',slug:parts.slice(1).join('/')};
  if(first==='tur'&&parts[1])return {kind:'genre',slug:parts.slice(1).join('/')};
  if(first==='etiket')return {kind:'tagIndex'};
  if(first==='tur')return {kind:'genreIndex'};
  if(first==='yazarlar')return {kind:'authorsIndex'};
  if(first==='yonetenler')return {kind:'directorsIndex'};
  if(first==='ara')return {kind:'search'};
  if(['films','series','books','concerts','favs','enler','lists'].includes(first)){
    const page=Number(parts[1]);
    return {kind:'view',view:first,page:Number.isInteger(page)&&page>0?page:1};
  }
  return {kind:'view',view:'home'};
}
function resetFilters(){state.q='';state.sort='date';state.min=0;state.genre='';state.status='';state.cat='';state.page=1}
/* Enler, tur ve filtre sayfalari yuzlerce kayit isler; kullaniciya once
   bilgi gosterilir, icerik bir sonraki karede basilir. Favoriler artik
   yalnizca dort izgara satiri oldugu icin burada degil. */
function slowRoute(route){
  if(route.kind==='view')return route.view==='enler';
  return route.kind==='tag'||route.kind==='genre'||route.kind==='filter';
}
function showLoading(){
  nav();
  main.innerHTML='<p class="loading"><span class="spinner" aria-hidden="true"></span>Yükleniyor…</p>';
}
function navigate(path,replace=false){
  const target=isLocal?'#'+path:hrefFor(path);
  try{history[replace?'replaceState':'pushState']({},'',target)}catch(_){if(isLocal)location.hash=path;else location.href=target}
  state.route=parseRoute();resetFilters();
  if(slowRoute(state.route)){showLoading();setTimeout(()=>render(),16)}
  else render();
  window.scrollTo(0,0);
}
function go(view){navigate(view==='home'?'/' :`/${view}`)}
function hrefForView(view){return hrefFor(view==='home'?'/' :`/${view}`)}

/** Tek kart. dateText verilirse yildiz puaninin altina tarih satiri eklenir
 *  ("Son okunanlar" / "Son izlenenler" satirlari icin).

 *  ONEMLI: `typeof dateText==='string'` kontrolu sart. Sitede 7 yerde

const RECENT_LIMIT=4;
/** Anasayfada gosterilecek kayit sayisi (4 kart = .grid'in bir satiri). */
function recentItems(sec,sortKey,labelKey,precisionKey){
  return (D[sec]||[])
    /* Kural 1: siralama anahtari olmayan kayit girmez -> tarihi bos ya da
       COZUMLENEMEYEN kayit sessizce atlanir (filmlerde 350 kayit boyle). */
    .filter(item=>item[sortKey]&&item[labelKey])
    /* Kural 2: hassasiyet 'day' veya 'month' olmali. 'year' olanlar GIRMEZ —
       onlarda gun/ay bilgisi yok, "1 Ocak 2011" gibi uydurma bir tarih
       gostermek yaniltici olurdu. Kitaplarda 175 kayit boyle.
       (firstReadSort yil-only kayitlar icin de DOLU; bu yuzden ayrica
       precisionKey ile elenmesi gerekiyor. Bu süzgec olmadan 175 kitap
       listeye giriyordu.) */
    .filter(item=>item[precisionKey]==='day'||item[precisionKey]==='month')
    /* Sira Sheet'teki satir sirasina DEGIL, tarihe gore. Ayni gune denk gelen
       kayitlarda ikincil olcut: Sheet'te daha ALTTA olan daha yeni sayilir
       (rowIndex buyuk = asagida = yeni kayit). */
    .sort((x,y)=>String(y[sortKey]).localeCompare(String(x[sortKey]))||y.rowIndex-x.rowIndex)
    .slice(0,RECENT_LIMIT);
}

 * Anasayfadaki "Rastgele" satiri
 * ------------------------------------------------------------------ */
/* Sheet puanlari 10 UZERINDENDIR; site 5 yildiza cevirir. Burada YILDIZ
   sayisina degil HAM puana gore filtrelenir: >=7 ham puan yani 3,5 yildiz ve
   uzeri (4 yildiz = 8/10, 4,5 yildiz = 9/10). */
const RANDOM_MIN_SCORE=7;
const RANDOM_COUNT=4;
/* Secici sirasi ve etiketleri. Ilk secim: Dizi. */
const RANDOM_KINDS=[['series','Dizi'],['films','Film'],['books','Kitap'],['mixed','Karışık']];
/* Sayfa basinda "Dizi"; secici degisince ve "Yeniden cek"e basilinca
   guncellenir. home() her cagrildiginda sifirlanir (sayfa yenilenince yeni
   rastgele secim olur). */
let randomState={kind:'series',picks:[],poolSize:0};

/** Secilen turun havuzu. Karisik modda film+dizi+kitap TEK havuzda birlesir;
 *  listeler birlestirilip her kayit esit olasilikla secildigi icin hicbir
 *  ture oncelik verilmez. */
function randomPool(kind){
  const list=(kind==='mixed')?[...(D.films||[]),...(D.series||[]),...(D.books||[])]:(D[kind]||[]);
  /* Puan bos ya da sayiya cevrilemeyen kayitlar havuza GIRMEZ (sessizce).
     score null ise typeof 'object' -> elenir; string de elenir. */
  return list.filter(item=>typeof item.score==='number'&&isFinite(item.score)&&item.score>=RANDOM_MIN_SCORE);
}
/** Tek cekilis: ayni kayit iki kez cikmaz. Onceki 4 kayit havuz yeterince
 *  buyukse havuzdan tamamen cikarilir, boylece yeni cekilis onlarla ayni
 *  olmaz; havuz kucukse (4'ten az) elenen yoksa olanin tamami gosterilir. */
function drawRandom(kind,previous){
  const pool=randomPool(kind);
  if(pool.length<=RANDOM_COUNT)return pool.slice();
  const prevIds=new Set((previous||[]).map(item=>item.id||item.route));
  const fresh=pool.filter(item=>!prevIds.has(item.id||item.route));
  const src=fresh.length>=RANDOM_COUNT?fresh:pool;
  const out=[],used=new Set();
  /* Klasik "kismi Fisher-Yates": src'i karistir, ilk 4'unu al. Ayni kayit
     iki kez cikmaz ( Fisher-Yates her elemanı bir kez konumlandirir ). */
  const bag=src.slice();
  for(let i=bag.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=bag[i];bag[i]=bag[j];bag[j]=tmp;
  }
  for(const item of bag){ out.push(item); if(out.length>=RANDOM_COUNT)break; }
  return out;
}
/** Rastgele kartinin altindaki tarih metni.
 *  - Film  : watchLabel, tam bicim ("27 Eylül 2026"). Tarih yoksa bos.
 *  - Dizi  : Sheet'teki tarih sutunu "başladığım yıl" ve 142 kaydın hepsi 4
 *            haneli yıl; etiket/sıralama alanı üretilmediği için yılın kendisi
 *            yazılır ("2015").
 *  - Kitap : firstReadLabel. ANCAK sadece yıl yazılmışsa firstReadLabel o yılın
 *            en yeni ayını uydurur ("Ocak 2005") — geçen turda "gün uydurma"
 *            kararıyla aynı gerekçeyle burada da yalnızca yıl yazılır.
 *  Tarih boşsa hicbir sey yazilmaz (bos <span> bile konmaz). */
function randomDateText(item){
  if(item.sec==='films')return item.watchLabel||'';
  if(item.sec==='series')return /^\d{4}$/.test(clean(item.watchDate))?clean(item.watchDate):'';
  if(item.sec==='books'){
    if(item.firstReadPrecision==='year')return item.firstReadSort?item.firstReadSort.slice(0,4):'';
    return item.firstReadLabel||'';
  }
  return '';
}

function sortItems(list,how){
  const a=[...list];
  const score=x=>x.score==null?-1:x.score;
  const year=x=>x.yearNumber==null?-1:x.yearNumber;
  /* Kitaplar icin build betigi normalize "firstReadSort" (YYYY-AA-GG) uretir. */
  const dateOf=x=>dateSort(x.sec==='books'?(x.firstReadSort||x.firstReadDate):x.watchDate);
  const recent=(x,y)=>{
    const dx=dateOf(x),dy=dateOf(y);
    if(dx===dy)return y.rowIndex-x.rowIndex;
    if(dx===-Infinity)return 1;
    if(dy===-Infinity)return -1;
    return dy-dx;
  };
  const yearCompare=(x,y,ascending=false)=>{
    const dx=year(x),dy=year(y);
    if(dx===dy)return y.rowIndex-x.rowIndex;
    if(dx<0)return 1;
    if(dy<0)return -1;
    return ascending?dx-dy:dy-dx;
  };
  if(how==='date')a.sort(recent);
  else if(how==='dateasc')a.sort((x,y)=>recent(y,x));
  else if(how==='r')a.sort((x,y)=>score(y)-score(x)||recent(x,y));
  else if(how==='year')a.sort((x,y)=>yearCompare(x,y));
  else if(how==='yearasc')a.sort((x,y)=>yearCompare(x,y,true));
  else if(how==='title')a.sort((x,y)=>displayName(x).localeCompare(displayName(y),'tr'));
  else if(how==='category'){
    const rank=x=>{
      const key=looseKey(x.category);
      const i=PLAYLIST_CATEGORY_ORDER.findIndex(name=>looseKey(name)===key);
      return i<0?PLAYLIST_CATEGORY_ORDER.length:i;
    };
    a.sort((x,y)=>rank(x)-rank(y)||displayName(x).localeCompare(displayName(y),'tr'));
  }
  else if(how==='author')a.sort((x,y)=>clean(x.author).localeCompare(clean(y.author),'tr')||year(x)-year(y));
  else if(how==='tracks')a.sort((x,y)=>(y.tracks||0)-(x.tracks||0)||displayName(x).localeCompare(displayName(y),'tr'));
  return a;
}

  if(type==='playlists'){const ctl=$('#min');if(ctl)ctl.remove()}
  fillGrid(kind);

function fillGrid(kind){
  const q=foldText(state.q);
  const type=dataType(kind),cfg=cfgOf(kind);
  let list=(D[type]||[]).filter(item=>(!q||item.searchText.includes(q))&&(!state.genre||item.genres.includes(state.genre))&&(!state.cat||item.category===state.cat)&&(!state.min||item.score>=state.min)&&(!state.status||(state.status==='done'?item.done:state.status==='ongoing'?item.ongoing:!item.done)));
  list=sortItems(list,state.sort);
  const total=list.length,pages=totalPages(total);
  if(state.page>pages)state.page=pages;
  const shown=list.slice(0,state.page*PAGE_SIZE);
  $('#count').textContent=`${total.toLocaleString('tr-TR')} ${cfgOf(kind).unit}`;
  $('#grid').innerHTML=shown.length?shown.map(poster).join(''):'<p class="empty">Bu filtreyle eşleşen kayıt yok.</p>';
  const pager=$('#pager');
  if(pager)pager.innerHTML=pagerHtml(total,kind,state.page);
}
function filterPage(route){
  const type=route.type,value=findFilterValue(type,route.field,route.valueSlug);
  if(!value){notFound(route.valueSlug);return}
  const list=sortItems(D[type].filter(item=>fieldMatches(item,route.field,value)),state.sort);
  const title=route.field==='reason'&&type==='books'?'Nasıl keşfettim / neden okudum':route.field==='genre'&&type==='films'?'Tür (Letterboxd)':(FILTER_TITLES[route.field]||route.field);
  document.title=`${title}: ${value} — versucher`;
  const cfg=cfgOf(type),view=viewKey(type);
  main.innerHTML=`<a class="back" href="${esc(hrefFor('/'+view))}" data-route="/${view}">← ${cfg.label} listesine dön</a><h1 style="margin-top:1rem">${esc(title)}: ${esc(value)}</h1><p class="sub">${list.length.toLocaleString('tr-TR')} ${cfg.unit}</p><div class="grid" style="margin-top:1.4rem">${list.length?list.map(poster).join(''):'<p class="empty">Bu değerle eşleşen kayıt yok.</p>'}</div>`;
}
function findTagValue(slug){
  for(const type of ['books','films','series'])for(const item of D[type])for(const value of fieldValues(item,'mainLabel'))if(globalTagSlug(value)===slug)return value;
  return '';
}
/** Tur degerleri ucu birden fazla turu kapsar; slug butun turlerde birlikte hesaplanir. */
let _genreCache=null;
function genreValues(){
  if(_genreCache)return _genreCache;
  _genreCache=unique(['films','series','books','playlists'].flatMap(type=>(D[type]||[]).flatMap(item=>fieldValues(item,'genre'))));
  return _genreCache;
}
function globalGenreSlug(value){
  const base=slugPart(value);if(!base)return '';
  const collision=genreValues().some(other=>slugPart(other)===base&&valueKey(other)!==valueKey(value));
  return collision?`${base}-${valueHash(value)}`:base;
}
function findGenreValue(slug){
  for(const type of ['films','series','books','playlists'])for(const item of D[type]||[])for(const value of fieldValues(item,'genre'))if(globalGenreSlug(value)===slug)return value;
  return '';
}
const SEARCH_GROUPS=[['films','Filmler'],['series','Diziler'],['books','Kitaplar'],['playlists','Playlistler']];
/** Adresten sorguyu okur: /ara?q=... (yerelde #/ara?q=...). */
function searchQuery(){
  let raw='';
  if(isLocal){raw=location.hash||'';}
  else{raw=location.search||'';}
  const at=raw.indexOf('?');
  if(at<0&&isLocal)return '';
  try{return new URLSearchParams(at<0?raw:raw.slice(at+1)).get('q')||''}catch(_){return ''}
}
/** Tum turlerde ayni anda arar; once tam eslesen ad, sonra baslayan ad, sonra icerenler. */
function searchSections(q){
  const needle=foldText(String(q||'').trim());
  if(!needle)return {html:'',total:0};
  const rank=name=>name===needle?0:name.startsWith(needle)?1:2;
  let total=0;
  const html=SEARCH_GROUPS.map(([type,label])=>{
    const list=(D[type]||[]).filter(item=>item.searchText.includes(needle)).sort((a,b)=>{
      const an=foldText(displayName(a)),bn=foldText(displayName(b));
      return rank(an)-rank(bn)||an.localeCompare(bn,'tr');
    });
    if(!list.length)return '';
    total+=list.length;
    return `<section class="tag-result-section"><div class="sh"><h2>${label}</h2><span class="sub">${list.length.toLocaleString('tr-TR')} kayıt</span></div><div class="grid">${list.map(poster).join('')}</div></section>`;
  }).join('');
  return {html,total};
}
function searchInfo(q,total){
  return String(q||'').trim()
    ?`"${esc(String(q).trim())}" için ${total.toLocaleString('tr-TR')} sonuç`
    :'Film, dizi, kitap ve playlistlerde aynı anda arar. Kısayol: <kbd>/</kbd>';
}
function searchPage(){
  const found=searchSections(state.q);
  document.title=(String(state.q).trim()||'Arama')+' - versucher';
  main.innerHTML=`<h1>Arama</h1><div class="ctl search-ctl"><input id="sq" type="search" placeholder="Film, dizi, kitap, playlist, yazar, yönetmen, tür…" aria-label="Site genelinde ara" autocomplete="off" spellcheck="false" value="${esc(state.q)}"></div><p class="sub" id="search-info" style="margin-top:.9rem">${searchInfo(state.q,found.total)}</p><div id="search-results" style="margin-top:1.6rem">${found.html}</div>`;
  const input=$('#sq');
  if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}
}

   favoriler sayfasindaki "Tum N ... gor" baglantilari buraya gelir, buradan da

const DIZINLER=[['/tur','Türler'],['/etiket','Main label'],['/yazarlar','Yazarlar'],['/yonetenler','Yönetmenler']];
const dizinSatiri=`<p class="dizin-nav">${DIZINLER.map(([href,label])=>`<a class="link-chip" href="${esc(hrefFor(href))}" data-route="${esc(href)}">${esc(label)}</a>`).join(' ')}</p>`;
/** Index sayfalari bir zamanlar ana sayfaya dusuyordu; artik gercek birer liste var.
 *  /etiket  -> tum main label'lar (sanal olarak 400+ adet)
 *  /tur     -> film + dizi + kitap turleri (+ playlist muzik turleri)
 * Favoriler sayfasi yalnizca ilk 10 etiketi gosterip buraya yonlendirir; boylece
 * en agir sayfanin DOM yuku dusuyor.
 */

function indexShell(eyebrow,title,intro,body){
  document.title=title+' - versucher';
  return `<a class="back" href="${esc(hrefFor('/'))}" data-route="/">&larr; Ana sayfa</a>`
    +`<p class="eyebrow" style="margin-top:1.4rem">${esc(eyebrow)}</p>`
    +dizinSatiri
    +`<h1>${esc(title)}</h1><p class="sub" style="max-width:60ch">${esc(intro)}</p>`
    +`<div class="favs" style="margin-top:1.6rem">${body}</div>`;
}
function indexGroup(title,list,toPath,unit){
  if(!list.length)return '';
  const chips=list.map(entry=>{
    const path=toPath(entry.value);
    const label=path
      ?`<a class="fav-link" href="${esc(hrefFor(path))}" data-route="${esc(path)}">${esc(entry.value)}</a>`
      :esc(entry.value);
    return `<li>${label}<span class="fav-count">${entry.count}</span></li>`;
  }).join('');
  return `<section><h2>${esc(title)} <span class="sub">${list.length} ${esc(unit)}</span></h2><ul class="idx-list">${chips}</ul></section>`;
}

function row(label,value){
  if(missing(value))return null;
  return [label,esc(clean(value))];
}
function splitMulti(value){
  return splitList(value).flatMap(part=>clean(part).split(/\s+-\s+/).map(clean)).filter(v=>!missing(v));
}
function fictionBucket(value){
  const s=slugPart(value);
  if(!s)return '';
  return ['kurgu','evet','yes','true','fiction'].includes(s)?'kurgu':'kurgu-disi';
}
function fieldValues(item,field){
  if(field==='mainLabel')return splitList(item.mainLabel);
  if(item.sec==='books'){
    if(field==='author')return splitList(item.author);
    if(field==='publisher')return splitList(item.publisher);
    if(field==='translator')return splitList(item.translator);
    if(field==='formats')return splitList(item.formats);
    if(field==='acquisition')return splitList(item.acquisition);
    if(field==='genre')return item.genres;
    if(field==='subgenre')return item.subgenres;
    if(field==='authorOrigin')return splitList(item.authorOrigin);
    if(field==='writtenLanguage')return splitList(item.writtenLanguage);
    if(field==='fiction')return missing(item.fiction)?[]:[clean(item.fiction)];
    if(field==='city')return missing(item.city)?[]:[clean(item.city)];
    if(field==='reason')return splitList(item.reason);
  }else if(item.sec==='films'){
    if(field==='genre')return item.genres;
    if(field==='platform')return splitList(item.platform);
    if(field==='director')return splitMulti(item.directorRaw);
    if(field==='firstCity')return splitList(item.firstCity);
    if(field==='creator')return splitList(item.creator);
    if(field==='country')return item.countries;
    if(field==='directorOrigin')return splitList(item.directorOrigin);
    if(field==='reason')return splitList(item.reason);
  }else if(item.sec==='series'){
    if(field==='genre')return item.genres;
    if(field==='platform')return splitList(item.platform);
    if(field==='done')return missing(item.doneRaw)?[]:[clean(item.doneRaw)];
    if(field==='firstCity')return splitList(item.firstCity);
    if(field==='creator')return splitList(item.creator);
    if(field==='country')return item.countries;
  }else if(item.sec==='playlists'){
    if(field==='genre')return item.genres;
    if(field==='category')return missing(item.category)?[]:[clean(item.category)];
  }
  return [];
}
/* valueKey de sik cagriliyor (collectValues, fieldMatches); onbellek. */
const _valueKeyCache=new Map();
function valueKey(value){
  const key=String(value);
  if(_valueKeyCache.has(key))return _valueKeyCache.get(key);
  const out=clean(value).toLocaleLowerCase('tr-TR');
  _valueKeyCache.set(key,out);
  return out;
}
function valueHash(value){let hash=0;for(const c of valueKey(value))hash=(Math.imul(hash,31)+c.charCodeAt(0))|0;return (hash>>>0).toString(36)}
/* Bu degerler her etiket icin yeniden hesaplaniyordu; favoriler sayfasi
   yuzlerce kez tarandi ve yavas kaliyordu. Onbellek. */
let _siblingCache=new Map();
function siblingValues(type,field){
  const key=type+':'+field;
  if(_siblingCache.has(key))return _siblingCache.get(key);
  const values=field==='mainLabel'
    ?['books','films','series'].flatMap(kind=>(D[kind]||[]).flatMap(item=>fieldValues(item,field)))
    :(D[type]||[]).flatMap(item=>fieldValues(item,field));
  _siblingCache.set(key,values);
  return values;
}
function routeValueSlug(type,field,value){
  const base=slugPart(value);if(!base)return '';
  const collision=siblingValues(type,field).some(other=>slugPart(other)===base&&valueKey(other)!==valueKey(value));
  return collision?`${base}-${valueHash(value)}`:base;
}
function globalTagSlug(value){return routeValueSlug('books','mainLabel',value)}
function fieldMatches(item,field,value){
  if(field==='fiction')return !!fictionBucket(value)&&fictionBucket(item.fiction)===fictionBucket(value);
  const target=valueKey(value);if(!target)return false;
  return fieldValues(item,field).some(candidate=>valueKey(candidate)===target);
}
function filterPath(type,field,value){
  const slug=routeValueSlug(type,field,value);
  return slug?`/${ROUTE_PREFIX[type]}/filtre/${field}/${slug}`:'';
}
function fieldChips(item,field){
  return unique(fieldValues(item,field)).map(value=>{
    const path=filterPath(item.sec,field,value);
    return path?`<a class="link-chip" href="${esc(hrefFor(path))}" data-route="${esc(path)}">${esc(value)}</a>`:'';
  }).join('');
}
function mainLabelChips(item){
  return unique(fieldValues(item,'mainLabel')).map(value=>{
    const slug=globalTagSlug(value),path=slug?`/etiket/${slug}`:'';
    return path?`<a class="tag-chip ml" href="${esc(hrefFor(path))}" data-route="${esc(path)}">${esc(value)}</a>`:'';
  }).join('');
}
/** Site disi sitelere giden linkler; ic baglantilardan gorunum olarak ayrilir. */
function extLink(value,label){
  const url=safeUrl(value);if(!url)return '';
  return `<a class="ext-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
}
function extLinks(pairs){
  const html=pairs.map(pair=>extLink(pair[0],pair[1])).filter(Boolean).join('');
  return html?`<div class="ext-links">${html}</div>`:'';
}
function chipRow(label,item,field){
  const chips=fieldChips(item,field);
  return chips?[label,`<div class="detail-value-chips">${chips}</div>`]:null;
}
function findFilterValue(type,field,slug){
  for(const item of D[type]||[])for(const value of fieldValues(item,field))if(routeValueSlug(type,field,value)===slug)return value;
  return '';
}
/** Orijinal ad, sitede goruntulenen adla ayni degilse gosterilmeli. displayName()
 *  filmlerde "on ek + film", diger turlerde sadece basligi dondurdugu icin
 *  her turde dogru karsilastirma yapar. */
function originalTitleDiffers(item){
  const original=valueKey(item.originalTitle);
  if(!original)return false;
  return original!==valueKey(displayName(item));
}
function detailSection(title,rows,className=''){
  const filtered=rows.filter(Boolean);if(!filtered.length)return '';
  /* Etiket icinde "||" iki satira bolunur: "Nasil kesfettim||neden izledim". */
  return `<section class="detail-section ${className}"><h2>${esc(title)}</h2><dl class="detail-list">${filtered.map(([label,value])=>`<div class="detail-row"><dt>${String(label).split('||').map(part=>esc(part)).join('<br>')}</dt><dd>${value}</dd></div>`).join('')}</dl></section>`;
}
function detailHeading(item){
  const fallback=item.yearNumber||item.year?`<span>${esc(item.yearNumber||item.year)}</span>`:'';
  const subline=item.sec==='books'?fieldChips(item,'author')
    :item.sec==='films'?fieldChips(item,'director')
    :item.sec==='series'?(item.creator?fieldChips(item,'creator'):fallback)
    :fallback;
  const series=item.sec==='books'?item.seriesName:item.sec==='films'?item.seriesOrder:'';
  const title=missing(series)?esc(displayName(item)):`${esc(displayName(item))} <span class="detail-series">(${esc(series)})</span>`;
  return `<div class="detail-heading"><h1>${title}</h1>${subline?`<div class="detail-subline">${subline}</div>`:''}</div>`;
}
function detailArt(item){return `<div class="detail-art">${imageFrame(item,true)}</div>`}
function detailTop(item){
  const main=mainLabelChips(item);
  let links='';
  if(item.sec==='books')links=extLinks([[item.goodreads,'goodreads']]);
  else if(item.sec==='films')links=extLinks([[item.letterboxd,'letterboxd'],[item.tmdb,'tmdb'],[item.imdb,'imdb']]);
  else if(item.sec==='series')links=extLinks([[item.tmdb,'tmdb'],[item.tvmaze,'tvmaze'],[item.imdb,'imdb']]);
  return `<div class="detail-top-info"><div class="detail-score">${scoreHtml(item)}</div>${main?`<div class="main-label-row">${main}</div>`:''}${links}</div>`;
}
/** Detay sayfasindaki oklar icin komsu kayitlar. Sira, o turun grid sayfasindaki
 *  siranin aynisidir (varsayilan 'date' siralamasi); boylece sagdaki kayit oku,
 *  soldaki kayit sola gider. Liste basinda onceki, sonunda sonraki yoktur ve
 *  o zaman o ok hic basilmaz. */
function neighbours(item){
  const list=sortItems(D[item.sec]||[],state.sort);
  const at=list.findIndex(other=>other.slug===item.slug);
  if(at<0)return {prev:null,next:null};
  return {prev:at>0?list[at-1]:null,next:at<list.length-1?list[at+1]:null};
}
function detailNavArrows(item){
  const {prev,next}=neighbours(item);
  const arrow=(entry,side,word)=>{
    if(!entry)return '';
    const name=displayName(entry);
    const label=word+': '+name;
    return `<a class="nav-arrow ${side}" href="${esc(hrefFor(entry.route))}" data-route="${esc(entry.route)}" title="${esc(label)}" aria-label="${esc(label)}">${side==='prev'?'&#8249;':'&#8250;'}</a>`;
  };
  return arrow(prev,'prev','Önceki')+arrow(next,'next','Sonraki');
}
/** Orijinal ve Türkiye yayın yılı aynıysa tek satırda "Yayın tarihi" gösterilir.
 *  199 kitaptan 77'sinde aynı; geri kalanında iki ayrı satır durur. Yılı
 *  okunamayanlar ("basılmadı", "bilinmiyor") aynı sayılmaz. */
function publishDateRows(item){
  const yearOf=value=>((String(value??'').match(/\d{4}/)||[])[0]||'');
  const original=yearOf(item.year),turkish=yearOf(item.turkishPublishDate);
  if(original&&original===turkish)return [row('Yayın tarihi',item.year)];
  return [row('Orijinal yayın tarihi',item.year),row('Türkiye yayın tarihi',item.turkishPublishDate)];
}

      ]),
      detailSection('Okuma bilgileri',[

        /* row() bos degerde null doner; doluysa gosterilir. */
        row('Nasıl keşfettim',item.reasonFound),

                row('İlk okuduğum dönem',item.firstReadLabel||item.firstReadDate),
        row('Kaç kez okudum?',item.readCountRaw),
        row('Tekrar okur muyum',item.reread),
        row('Kitap bende var mı?',item.owned),
        row('Okuduğum dil',item.readLanguage)
      ])
    ];
  }else if(item.sec==='films'){
    sections=[
      detailSection('Film',[
        /* Orijinal ad, yalnizca "on ek + film" ile ayni degilse gosterilir. */
        originalTitleDiffers(item)?row('Orijinal film adı',item.originalTitle):null,
        chipRow('Tür',item,'genre'),
        row('Uyarlama kaynağı',item.adaptation),
        row('Yapım yılı',item.year),
        chipRow('Yapım ülkesi',item,'country'),
        chipRow('Yönetmen',item,'director'),
        chipRow('Yönetmen köken',item,'directorOrigin'),
                row('Nasıl keşfettim',item.reasonFound),
        row('Neden izledim',item.reasonWhy),
        row('İzleme tarihi',item.watchDate),
        chipRow('İlk izlediğim platform',item,'platform'),
        chipRow('İlk izlediğim şehir',item,'firstCity'),
        row('Kaç kez izledim',item.watchCountRaw),
        row('Tekrar izler miyim',item.rewatch)
      ],'film-details')
    ];
  }else if(item.sec==='series'){
    sections=[
      detailSection('Dizi',[
        /* Orijinal ad, yalnizca "dizi" sutunundakinden farkli ise gosterilir. */
        valueKey(item.originalTitle)!==valueKey(item.title)?row('Orijinal adı',item.originalTitle):null,
        chipRow('Tür',item,'genre'),
        row('Uyarlama kaynağı',item.adaptation),
        row('Yapım yılı',item.year),
        chipRow('Yapım ülkesi',item,'country'),
        row('Creator / showrunner',item.creator),
                row('Durumu',item.statusRaw),
        row('Format',item.format),
        row('Dili',item.language),
        row('Network',item.network),
        row('Medium',item.category),
        row('Nasıl keşfettim',item.reasonFound),
        row('Neden izledim',item.reasonWhy),
        row('Başladığım yıl',item.watchDate),
        chipRow('İlk izlediğim platform',item,'platform'),
        chipRow('İlk izlediğim şehir',item,'firstCity'),
        row('Ne kadarını izledim',item.watched),
        row('Favori sezon',item.favoriteSeason),
        chipRow('Bitirdim mi?',item,'done'),
        row('Kaç kez bitirdim',item.completionCountRaw),
        row('Tekrar izler miyim',item.rewatch)
      ])
    ];
  }else{
    sections=[
      detailSection('Playlist',[
        row('Kategori',item.category),row('Şarkı sayısı',item.tracksRaw),chipRow('Tür',item,'genre'),row('His',item.feeling)
      ])
    ];
    if(item.spotify)extra=`<p style="margin-top:1.2rem"><a class="listen-btn" href="${esc(item.spotify)}" target="_blank" rel="noopener noreferrer">Playlisti dinle</a></p>`;
  }
  const backLabel={films:'Filmlere',series:'Dizilere',books:'Kitaplara',playlists:'Playlistlere'}[item.sec];
  const back=backLabel?`<a class="back" href="${esc(hrefFor('/'+viewKey(item.sec)))}" data-route="/${viewKey(item.sec)}">&larr; ${backLabel} dön</a>`:'';
  main.innerHTML=`<div class="detail-page">${detailNavArrows(item)}${back}${detailHeading(item)}<div class="detail-split"><div class="detail-art-column">${detailArt(item)}${detailTop(item)}</div><div class="detail-content"><div class="detail-sections">${sections.join('')}</div>${extra}</div></div></div>`;
}
function notFound(slug){
  document.title='Kayıt bulunamadı — versucher';
  main.innerHTML=`<a class="back" href="${esc(hrefFor('/'))}" data-route="/">← Ana sayfa</a><div class="placeholder" style="margin-top:1rem"><h2>Kayıt bulunamadı</h2><p>Bu adrese ait bir kayıt yok: <code>${esc(slug)}</code></p></div>`;
}
/** Ayni degerin buyuk/kucuk harf varyantlarini tek kayda indirger, adetleri toplar. */
/** Baslik karsilastirmak icin: HTML kacisi, tirnak cesidi ve aksanlari sadelestirir. */
function looseKey(value){
  return clean(value)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&#0?39;|&apos;|[\u2018\u2019\u02bc]/g,"'").replace(/&amp;/g,'&')
    .toLocaleLowerCase('tr-TR')
    .replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
    .replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/[çÇ]/g,'c')
    .replace(/\s+/g,' ').trim();
}
/** Yazar/yonetmen adini bosluk ve aksan duyarsiz yapar: "J.R.R. Tolkien" = "J. R. R. Tolkien". */
function nameKey(value){return looseKey(value).replace(/\s+/g,'')}

/** Sabit listeye gore siralar, ama YAZIMI VERIDEN alir (slug ile eslesmesi icin).
 *  Bulunamayan isim varsa konsola yazar; sessizce kaybolmaz. */
function pickNamed(list,names){
  const byKey=new Map(list.map(entry=>[nameKey(entry.value),entry]));
  const picked=[];const missing=[];
  for(const wanted of names){
    const hit=byKey.get(nameKey(wanted));
    if(hit)picked.push(hit); else missing.push(wanted);
  }
  if(missing.length)console.warn('Favoriler: listede bulunamayan isimler ->',missing);
  return picked;
}
function collectValues(values){
  const map=new Map();
  values.map(clean).filter(value=>!missing(value)).forEach(value=>{
    const key=valueKey(value);
    const found=map.get(key);
    if(found)found.count++;
    else map.set(key,{value,count:1});
  });
  /* En cok kayda sahip olan basta; ayni sayida ise alfabetik. */
  return [...map.values()].sort((a,b)=>b.count-a.count||a.value.localeCompare(b.value,'tr'));
}
/** "Enler" (/enler): eski Favoriler sayfasinin icerigi ve davranisi AYNI.
 *  Sadece ad ve adres degisti (/favs -> /enler). Alt aciklama metnine
 *  dokunulmadi. */
function enlerView(){
  /* Yazarlar: coklu yazarli kitaplar haric; onlardan yalnizca istenen uc kisi. */
  const authorValues=[];
  for(const item of D.books||[]){
    const names=fieldValues(item,'author');
    if(names.length<=1)authorValues.push(...names);
  }
  for(const item of D.books||[]){
    const names=fieldValues(item,'author');
    if(names.length<=1)continue;
    for(const wanted of FAV_MULTI_AUTHORS){
      /* looseKey: Sheet'te "Işın" yaziyor, listede "İşın" - ikisi de ayni kabul edilsin. */
      if(names.some(name=>looseKey(name)===looseKey(wanted)))authorValues.push(wanted);
    }
  }
  const authorList=collectValues(authorValues);
  const authors=pickNamed(authorList,FAV_AUTHORS_TOP);
  /* Yonetmenler: tek filmi olanlar gosterilmez, ayrica liste disi birkac isim var. */
  const directorList=collectValues((D.films||[]).flatMap(item=>item.directors||[]))
    .filter(entry=>entry.count>=FAV_MIN_DIRECTOR_FILMS
      &&!FAV_EXCLUDE_DIRECTORS.some(name=>valueKey(name)===valueKey(entry.value)));
  const directors=pickNamed(directorList,FAV_DIRECTORS_TOP);
  /* Türler tür tür ayrılır. DİKKAT: genreValues() tekilleştirdiği için burada KULLANILMAZ;
     aksi halde her türün sayısı hep 1 çıkardı. */
  const genresOf=kind=>collectValues((D[kind]||[]).flatMap(item=>fieldValues(item,'genre')));
  const byKind={books:genresOf('books'),series:genresOf('series'),films:genresOf('films'),playlists:genresOf('playlists')};
  const chips=(list,toPath)=>list.map(entry=>{
    const path=toPath(entry.value);
    if(!path)return `<li>${esc(entry.value)}</li>`;
    return `<li><a class="fav-link" href="${esc(hrefFor(path))}" data-route="${esc(path)}">${esc(entry.value)}</a><span class="fav-count">${entry.count}</span></li>`;
  }).join('');
  const more=(href,label)=>`<p class="fav-more"><a class="link-chip" href="${esc(hrefFor(href))}" data-route="${esc(href)}">${esc(label)}</a></p>`;
  const group=(title,list,toPath,tail='')=>list.length
    ?`<section><h2>${esc(title)} <span class="sub">${list.length} kayıt</span></h2><ul>${chips(list,toPath)}</ul>${tail}</section>`
    :'';
  const subGroup=(title,list,toPath,tail='')=>list.length
    ?`<div class="fav-sub"><h3>${esc(title)} <span class="sub">${list.length} tür</span></h3><ul>${chips(list,toPath)}</ul>${tail}</div>`
    :'';
  const typeRows=[['books','Kitap'],['series','Dizi'],['films','Film']]
    .filter(pair=>byKind[pair[0]].length)
    .map(pair=>subGroup(pair[1],byKind[pair[0]].slice(0,FAV_GENRE_KIND_LIMIT),value=>filterPath(pair[0],'genre',value)))
    .join('');
  /* "Türler tümü": bir türdeki film + dizi + kitaplar birlikte (/tur/<slug>). */
  const allGenres=collectValues(['books','series','films'].flatMap(kind=>(D[kind]||[]).flatMap(item=>fieldValues(item,'genre'))));
  const allRow=(subGroup('Türler tümü',allGenres.slice(0,FAV_GENRE_LIMIT),value=>{const slug=globalGenreSlug(value);return slug?'/tur/'+slug:''})
    +more('/tur',`Tüm ${allGenres.length} türü gör`));
  /* Main label olarak işaretlenenler (/etiket/<slug>). */
  /* 400+ etiket favoriler sayfasinda tek tek basilirdi; en agir sayfa buydu.
     Ilk 10 gosterilir, tamami /etiket dizininde. */
  const labelValues=['books','series','films'].flatMap(kind=>(D[kind]||[]).flatMap(item=>fieldValues(item,'mainLabel')));
  const labelList=collectValues(labelValues);
  const labelRow=(labelList.length?subGroup('Main label',labelList.slice(0,FAV_LABEL_LIMIT),value=>{const slug=globalTagSlug(value);return slug?'/etiket/'+slug:''}):'')+more('/etiket',`Tüm ${labelList.length.toLocaleString('tr-TR')} etiketi gör`);
  const turler=(typeRows+allRow+labelRow)?`<section><h2>Türler</h2>${typeRows}${allRow}${labelRow}</section>`:'';
  const muzik=subGroup('Müzik türleri',byKind.playlists.slice(0,FAV_MUSIC_LIMIT),value=>filterPath('playlists','genre',value));
  const authorTail=more('/yazarlar',`Tüm ${authorList.length} yazarı gör`);
  const directorTail=more('/yonetenler',`Tüm ${directorList.length} yönetmeni gör`);
  main.innerHTML=`<h1>Enler</h1><p class="sub">Yazarlar ve yönetmenler elle seçilmiş sırayı, türler ve etiketler sayıya göre sıralanır. Sayı o değeri taşıyan gerçek kayıt adedidir; bağlantıya tıklayınca o kişinin ya da türün kayıtları listelenir.</p><div class="favs" style="margin-top:1.5rem">${group('Yazarlar',authors,value=>filterPath('books','author',value),authorTail)}${group('Yönetmenler',directors,value=>filterPath('films','director',value),directorTail)}${turler}${muzik}</div>`;
}
function placeholderView(kind){
  const isConcerts=kind==='concerts';
  main.innerHTML=`<h1>${CFG[kind].label}</h1><div class="placeholder" style="margin-top:1.5rem"><h2>${isConcerts?'Konserler yakında':'Playlistler yakında'}</h2><p>${isConcerts?'Konser veri tablosu eklenince afişler ve kişisel konser sayfaları burada açılacak.':'Playlist veri tablosu eklenince liste sayfaları burada açılacak.'}</p></div>`;
}
function viewKey(type){return type==='playlists'?'lists':type}
function cfgOf(type){return CFG[viewKey(type)]||CFG[type]||{label:type,unit:type}}
function nav(){
  const current=(state.route.kind==='detail'||state.route.kind==='filter')?viewKey(state.route.type):(state.route.view||'');
  $('#nav').innerHTML=NAV.map(([key,label])=>`<a href="${esc(hrefForView(key))}" data-route="${key==='home'?'/':`/${key}`}" ${current===key?'aria-current="page"':''}>${label}</a>`).join('');
}
/* Afisler innerHTML ile eklendigi icin onbellekten gelen, load olayini atlayan
   goreller isaretlenmeli. */
function render(){
  renderPage();
  markLoadedImages();
}
function renderPage(){
  updateStatus();nav();
  if(state.route.kind==='detail'){
    const item=REG.get(`${state.route.type}:${state.route.slug}`);
    if(item){document.title=displayName(item)+' — versucher';detailPage(item)}else{document.title='Kayıt bulunamadı — versucher';notFound(state.route.slug)}
    return;
  }
  if(state.route.kind==='filter'){filterPage(state.route);return}
  if(state.route.kind==='tag'){tagPage(state.route);return}
  if(state.route.kind==='tagIndex'){tagIndexView();return}
  if(state.route.kind==='authorsIndex'){authorIndexView();return}
  if(state.route.kind==='directorsIndex'){directorIndexView();return}
  if(state.route.kind==='genre'){genrePage(state.route);return}
  if(state.route.kind==='genreIndex'){genreIndexView();return}
  if(state.route.kind==='search'){state.q=searchQuery();searchPage();return}
  if(state.route.kind==='view')state.page=state.route.page||1;
  document.title=CFG[state.route.view]?.label?CFG[state.route.view].label+' — versucher':'versucher';
  if(state.route.view==='home')home();
  else if(['films','series','books','lists'].includes(state.route.view))gridView(state.route.view);
  else if(state.route.view==='favs')favoritesView();
  else if(state.route.view==='enler')enlerView();
  else placeholderView(state.route.view);
}

const root=document.documentElement;
function currentTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function themeLabel(){$('#theme').textContent=currentTheme()==='dark'?'Açık tema':'Koyu tema'}
try{const saved=localStorage.getItem('theme');if(saved)root.dataset.theme=saved}catch(_){}
$('#theme').addEventListener('click',()=>{const next=currentTheme()==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('theme',next)}catch(_){}themeLabel()});
themeLabel();

document.addEventListener('click',event=>{
  const route=event.target.closest('[data-route]');
  if(route&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey){event.preventDefault();navigate(route.dataset.route);return}
  /* "Rastgele" bolumu: tur secici ve "Yeniden cek". Diger butonlardan
     bagimsiz; sadece bu iki siniftir. */
  const pick=event.target.closest('[data-rand-kind]');
  if(pick){
    randomState.kind=pick.dataset.randKind;
    randomState.picks=[];
    randomState.picks=drawRandom(randomState.kind,[]);
    /* secili dugmenin isaretini tazele (aria-pressed) */
    [].forEach.call(document.querySelectorAll('[data-rand-kind]'),b=>{b.setAttribute('aria-pressed',String(b.dataset.randKind===randomState.kind))});
    renderRandom();
    return;
  }
  if(event.target.closest('[data-rand-redraw]')){
    randomState.picks=drawRandom(randomState.kind,randomState.picks);
    renderRandom();
    return;
  }
});
document.addEventListener('input',event=>{
  if(event.target.id==='q'){state.q=event.target.value;state.page=1;fillGrid(state.route.view);return}
  if(event.target.id==='sq'){
    state.q=event.target.value;
    const found=searchSections(state.q);
    const box=$('#search-results'),info=$('#search-info');
    if(box)box.innerHTML=found.html||(String(state.q).trim()?'<p class="empty">Bu sorguyla eşleşen kayıt yok.</p>':'');
    if(info)info.innerHTML=searchInfo(state.q,found.total);
    /* Adresi güncelle ki arama paylaşılabilir olsun; sayfa yeniden yüklenmesin.
       Yerelde rota hash'in içinde olduğu için korunur, yoksa rota kaybolur. */
    const q=String(state.q).trim();
    const base=isLocal?location.pathname+(location.hash||'').split('?')[0]:location.pathname;
    try{history.replaceState({},'',q?`${base}?q=${encodeURIComponent(q)}`:base)}catch(_){}
  }
});
/* "/" tusu aramayi acar; alan bos degilse sayfa ici arama kutusuna odaklanir. */
document.addEventListener('keydown',event=>{
  if(event.key!=='/'||event.metaKey||event.ctrlKey||event.altKey)return;
  const tag=(event.target&&event.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(event.target&&event.target.isContentEditable))return;
  event.preventDefault();
  if(state.route.kind==='search'){const input=$('#sq');if(input){input.focus();input.select()}return}
  navigate('/ara');
});
/* Sol/sag ok tuslari, detay sayfasindaki kenardaki oklarla ayni is yapar.
   Butona basilmis gibi davranmanin en saglam yolu ayni adresi gezmek: oka
   basilca ne oluyorsa o. Ok yoksa (listenin basi/sonu, ya da detay sayfasi
   disinda bir sayfa) hicbir sey olmaz. */
document.addEventListener('keydown',event=>{
  if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;
  /* Shift+Ok metin secimi, Ctrl/Cmd+Ok tarayici gezinmesi; karistirma. */
  if(event.metaKey||event.ctrlKey||event.altKey||event.shiftKey)return;
  /* Alan/ liste icindeyken ok tusu o denetimi ait; hic dokunma. */
  const tag=(event.target&&event.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(event.target&&event.target.isContentEditable))return;
  const arrow=document.querySelector(event.key==='ArrowLeft'?'.nav-arrow.prev':'.nav-arrow.next');
  if(!arrow)return;
  event.preventDefault();
  navigate(arrow.dataset.route);
});
document.addEventListener('change',event=>{
  if(!event.target.id)return;
  if(event.target.id==='sort')state.sort=event.target.value;
  else if(event.target.id==='min')state.min=Number(event.target.value);
  else if(event.target.id==='genre')state.genre=event.target.value;
  else if(event.target.id==='status')state.status=event.target.value;
  else if(event.target.id==='cat')state.cat=event.target.value;
  else return;
  state.page=1;fillGrid(state.route.view);
});
/* Afisler innerHTML ile eklendigi icin tek dinleyici yeter. load olayı
   yuklenmez; bu yuzden capture (true) ile dinlenir. */
document.addEventListener('load',event=>{
  const image=event.target;
  if(image instanceof HTMLImageElement&&image.closest('.cover'))image.closest('.cover').classList.add('is-loaded');
},true);
document.addEventListener('error',event=>{
  const image=event.target;
  if(image instanceof HTMLImageElement&&image.closest('.cover')){
    const cover=image.closest('.cover');
    image.remove();
    cover.classList.remove('has-image');
    cover.classList.add('is-loaded');
  }
},true);
/* Onbellekten gelen, load olayi atlayan goreller: hazir mi diye bakilir. */
function markLoadedImages(){
  document.querySelectorAll('.cover img').forEach(image=>{
    if(image.complete&&image.naturalWidth>0)image.closest('.cover').classList.add('is-loaded');
  });
}
function routeSignature(route){return [route.kind,route.type||'',route.view||'',route.page||'',route.slug||'',route.field||'',route.valueSlug||''].join('|')}
function syncFromLocation(){
  const next=parseRoute();
  if(routeSignature(next)===routeSignature(state.route))return;
  state.route=next;resetFilters();render();
}
window.addEventListener('popstate',syncFromLocation);
window.addEventListener('hashchange',syncFromLocation);

updateStatus();
loadData();
</script>
