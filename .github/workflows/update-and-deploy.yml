name: Veriyi güncelle ve yayınla

# Saatlik veri üretimi + aynı akışta GitHub Pages yayını.
# Tarayıcı Google Sheets'e bağlanmaz; veri burada üretilip data/*.json olarak depoya yazılır.

on:
  # Site kodunda yapılan her değişiklik anında yayınlansın.
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-and-deploy.yml'
  # Sheets verisi saatte bir kendiliğinden tazelensin.
  schedule:
    # Her saat, saatin 23. dakikasında (tam saatte GitHub zamanlayıcısı yoğun olur).
    - cron: '23 * * * *'
  # Elle tetikleme.
  workflow_dispatch:

permissions:
  contents: write   # data/ değiştiyse commit atmak için
  pages: write       # GitHub Pages yayını için
  id-token: write   # deploy-pages jetonu için

# Aynı anda iki yayın yapılmasın.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Veriyi üret
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu getir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CSV'ler UTF-8 olarak indirilir, başlık adına göre sütunlar eşlenir ve
      # data/{books,films,series}.json üretilir.
      #   - içerik CSV değilse / beklenen başlıklar yoksa / kayıt sayısı önceki
      #     sürümün yarısının altındaysa: mevcut JSON'a dokunulmadan iş hata ile biter.
      - name: CSV indir, sütunları eşle, JSON üret
        run: node scripts/build-data.mjs

      - name: Değişiklikleri commit et
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Veri değişmedi, commit atlanıyor."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "veri: Google Sheets güncellemesi $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Zamanlanmış çalışmalarda araya başka commit girmiş olabilir.
          # Dikkat: "git pull --rebase" çakışmada yarım kalmış bir çalışma ağacı bırakır
          # (dosyaların içine <<<<<<< HEAD yazar). O ağaç paketlenip YAYINLANIRSA
          # site "Unexpected token '<'" hatası verir. Bu yüzden her denemeden sonra
          # yarım kalan rebase/merge temizlenir ve yalnızca temiz ağaç push edilir.
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "push denemesi $i başarısız, yarım kalan işlem temizleniyor..."
            # Yarım kalan rebase'i iptal et: bu, commit'ten ÖNCEki duruma döner,
            # yani üretilmiş (geçerli) veri dosyaları çalışma ağacında kalır.
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git rebase --skip 2>/dev/null || true
            sleep 15
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::warning::Veri commit'i şimdilik gönderilemedi; sonraki saatte tekrar denenecek."
          else
            echo "Veri commit edildi."
          fi

      # Yayın öncesi son savunma hattı: bozuk dosya asla deploy edilmez.
      - name: Yayınlanacak ağacın sağlam olduğunu doğrula
        run: |
          set -e
          # 404.html bir adim once uretildi; bu yuzden kirli sayilmayacak.
          if [ -n "$(git status --porcelain -- . ':(exclude)404.html')" ]; then
            echo "::error::Çalışma ağacı temiz değil; yayınlamak yerine duruluyor."
            git status --short
            exit 1
          fi
          if git grep -qE '^(<<<<<<< |=======$|>>>>>>> )' -- '*.json' '*.html' '*.mjs'; then
            echo "::error::Depoda çakışma işareti bulundu; yayınlanmıyor."
            git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- '*.json' '*.html' '*.mjs' | head -20 || true
            exit 1
          fi
          for f in data/books.json data/films.json data/series.json data/playlists.json; do
            node -e "const d=JSON.parse(require('fs').readFileSync('$f','utf8'));if(!Array.isArray(d.items)||!d.items.length)throw new Error('boş kayıt listesi');"
            echo "  $f geçerli ($(node -e "console.log(JSON.parse(require('fs').readFileSync('$f','utf8')).items.length)") kayıt)"
          done
          echo "Yayınlanacak dosyalar sağlam."
      - name: 404.html dosyasini index.html'den uret
        run: |
          if ! cmp -s index.html 404.html; then
            echo "::warning::Depodaki 404.html index.html ile ayni degildi; uretilerek duzeltiliyor."
          fi
          cp index.html 404.html
          if ! cmp -s index.html 404.html; then
            echo "::error::404.html uretilemedi."
            exit 1
          fi
          if [ -e arsiv-taslak-v6.html ]; then
            echo "::error::arsiv-taslak-v6.html hala depoda; kaldirilmalidir."
            exit 1
          fi
          echo "404.html index.html ile ayni ($(wc -c < index.html) bayt)."

      - name: Yerel tutarlilik kontrolleri
        run: node scripts/check-data.mjs

      # Rota denemesi: site GitHub Pages gibi sunulur (bilinmeyen yol -> 404.html,
      # 404 kodu) ve secilen rotalar bassiz tarayicida acilir. Boylece "detay
      # sayfasinda yenilemede veri hatasi" gibi regresyonlar insan gozune degil
      # makineye birakilir. Tarayici yoksa betik atlar ve 0 doner.
      #
      # continue-on-error: Bu adim YAVAS ve tarayiciya bagli; ilk CI kosusunda
      # 90 sn'lik zaman asimi yalnizca "tarayici calistirilamadi" gibi YANLIIS
      # bir hata uretmis ve 1,5 saat boyunca yayini durdurmus, kimse de nedenini
      # gormemis. Veri kontrolu (onceki adim) hizli, tarayicisiz ve ELDEN
      # GECIRILMIS oldugu icin asil kapidir. Rota denemesi yayini bloklamaz,
      # ancak hata halinde adim kirmiziyi gorunur ve ::error:: notu birakir.
      - name: Rota denemesi
        continue-on-error: true
        run: node scripts/check-site.mjs

      - name: GitHub Pages yapılandır
        id: pages
        uses: actions/configure-pages@v5

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: GitHub Pages'a yayınla
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
