<style>

}

    --text:#B9BFC9;--muted:#8A94A6;--accent:#DE7488;--star:#9AA7BD;--link:#fff2cc;

    --ledge-a:#3a475e;--ledge-b:#2b3548;

}
:root[data-theme="dark"]{
  --bg:#1b2230;--panel:#283244;--raise:#303c52;--well:#19212d;--line:#38455c;
  --text:#B9BFC9;--muted:#8A94A6;--accent:#DE7488;--star:#9AA7BD;--link:#fff2cc;

}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.65;font-size:16px}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

.pal1{background:linear-gradient(#1f3a44,#0f1e26)}

.shelf span:last-child{color:var(--muted);font-weight:400}
.empty{font-family:var(--ui);color:var(--muted);padding:2rem 0}
.loading{font-family:var(--ui);color:var(--muted);padding:2rem 0}
.back{font-family:var(--ui);font-size:.85rem;color:var(--link);text-decoration:underline;text-underline-offset:3px}

.detail-heading{grid-column:1/-1;margin:0;padding:0;min-width:0}
.detail-heading h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.15;overflow-wrap:anywhere}

.detail-subline .link-chip{font-size:1em;text-decoration:none;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
.detail-subline .link-chip:hover{color:var(--text);border-bottom-color:var(--line)}
.detail-split{display:contents}
.detail-art-column{grid-column:1;position:sticky;top:1rem;align-self:start;min-width:0;padding:0 calc(var(--gap) / 2) 25px 0}
.detail-content{grid-column:2;position:relative;min-width:0;padding:0 0 0 calc(var(--gap) / 2)}
.detail-content::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line)}
.detail-top-info{min-width:0;margin-top:1rem}
.detail-art-column .cover{width:100%;max-width:none;box-shadow:0 2px 5px rgba(0,0,0,.55),0 20px 34px -10px rgba(0,0,0,.55)}
.detail-art-column .detail-top-info{text-align:center}
.detail-art-column .detail-top-info .main-label-row,.detail-art-column .detail-top-info .compact-links{justify-content:center}
.detail-series{font-family:var(--ui);font-size:.7em;font-weight:400;color:var(--muted);white-space:nowrap;margin-left:.35rem;vertical-align:middle}
.detail-content .detail-sections{margin-top:0}

.compact-links{margin-top:.75rem}
.tag-chip,.compact-link{display:inline-flex;align-items:center;align-self:flex-start;width:fit-content;max-width:100%;font-family:var(--ui);font-size:.76rem;line-height:1.3;color:var(--link);background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:.22rem .5rem;text-decoration:none;overflow-wrap:anywhere;box-shadow:inset 0 1px 0 var(--hi)}
.tag-chip.ml{font-weight:700;border-color:var(--hi)}
.link-chip{display:inline;font-family:var(--ui);font-size:.92rem;line-height:1.6;color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--line);overflow-wrap:anywhere}
.link-chip:hover{text-decoration-color:currentColor}
.ext-links{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.8rem;justify-content:center}
.ext-link{font-family:var(--ui);font-size:.78rem;line-height:1.4;color:var(--link);text-decoration:none;border-bottom:1px dotted var(--link);padding-bottom:1px;white-space:nowrap}
.ext-link:hover{border-bottom-style:solid}
.ext-link::after{content:" ↗";font-size:.8em;opacity:.65}
.pl-name{display:block;font-family:var(--ui);font-size:.8rem;font-weight:600;line-height:1.3;color:var(--text);text-align:center;margin-top:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-card .cover{aspect-ratio:1/1}
.pager{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-top:2.2rem;font-family:var(--ui)}
.pager a,.pager span{display:inline-flex;align-items:center;justify-content:center;min-width:2.1rem;height:2.1rem;padding:0 .5rem;border:1px solid var(--line);border-radius:3px;color:var(--link);text-decoration:none;font-size:.82rem;background:var(--raise)}
.pager a:hover{border-color:var(--link)}
.pager .pager-cur{background:var(--link);color:var(--text);border-color:var(--link);font-weight:700}
.grid-sentinel{height:1px}
.bar-actions{display:flex;align-items:center;gap:.4rem}
.search-btn{display:inline-flex;align-items:center;gap:.35rem;text-decoration:none;line-height:1.1}
.search-btn svg{display:block;flex:none}
.search-ctl input{flex:1 1 100%;max-width:none}
.search-ctl{margin:1.1rem 0 .4rem}
kbd{font-family:var(--ui);font-size:.72rem;background:var(--well);border:1px solid var(--line);border-radius:3px;padding:.05rem .3rem}
.favs ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.favs li{display:inline-flex;align-items:baseline;gap:.3rem}
.fav-link{font-family:var(--ui);font-size:.82rem;line-height:1.6;color:var(--link);background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:.22rem .5rem;text-decoration:none;overflow-wrap:anywhere;box-shadow:inset 0 1px 0 var(--hi)}
.fav-link:hover{border-color:var(--link)}
.fav-count{font-family:var(--ui);font-size:.68rem;color:var(--muted)}
.fav-sub{margin-top:1.1rem}
.fav-sub:first-of-type{margin-top:.6rem}
.fav-sub h3{font-family:var(--ui);font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.03em;margin:0 0 .5rem}

.tag-chip:hover,.compact-link:hover{border-color:var(--link);text-decoration:underline;text-underline-offset:2px}

.detail-value-chips .tag-chip{font-size:.72rem;padding:.16rem .4rem}
.film-details .detail-value-chips{gap:.7rem}

.tag-result-section{margin-top:1.6rem}

.detail-page .detail-subline,.detail-page .detail-score,.detail-page .detail-section,.detail-page .detail-row,.detail-page .detail-row dt,.detail-page .detail-row dd,.detail-page .detail-note,.detail-page .back,.detail-page .tag-chip,.detail-page .compact-link{font-size:15px}
.placeholder{background:var(--raise);border:1px dashed var(--line);border-radius:4px;padding:2rem 1.2rem;text-align:center;color:var(--muted);font-family:var(--ui)}
@media (max-width:700px){.detail-page{grid-template-columns:minmax(0,1fr);row-gap:0}.detail-heading{grid-column:1;padding:0 0 1.25rem}.detail-art-column{grid-column:1;position:relative;top:auto;max-width:none;padding:0 0 1.2rem}.detail-content{grid-column:1;border-top:1px solid var(--line);padding:1.2rem 0 0}.detail-content::before{display:none}.detail-heading h1{font-size:2rem}}

<header>

<script>
'use strict';

/* Veri dosyaları GitHub Actions tarafından üretilir (scripts/build-data.mjs).
   Tarayıcı Google Sheets'e hiç bağlanmaz; yalnızca data/*.json okunur.
   no-store ile istenir: önbellekten eski veri gelmesin. */
const DATA_FILES={books:'data/books.json',films:'data/films.json',series:'data/series.json',playlists:'data/playlists.json'};

const CFG={
  films:{label:'Filmler',unit:'film',fav:'Favori filmler',dateLabel:'İzlenme tarihi'},
  series:{label:'Diziler',unit:'dizi',fav:'Favori diziler',dateLabel:'İzlenme tarihi'},
  books:{label:'Kitaplar',unit:'kitap',fav:'Favori kitaplar',dateLabel:'İlk okunma tarihi'},
  concerts:{label:'Konserler',unit:'konser',recent:'Konserler',dateLabel:'Tarih'},
  lists:{label:'Playlistler',unit:'playlist',fav:'Favori playlistler',dateLabel:''}
};
const ROUTE_PREFIX={books:'kitap',films:'film',series:'dizi',playlists:'playlist'};
const FILTER_TITLES={author:'Yazar',genre:'Tür',subgenre:'Alt tür',authorOrigin:'Yazar köken',fiction:'Kurgu mu?',city:'İlk okunan şehir',acquisition:'İlk erişim / edinim şekli',formats:'Okunan tüm formatlar',translator:'Çevirmen',publisher:'Yayınevi',platform:'İlk kez hangi platformda',director:'Yönetmen',firstCity:'İlk kez izlenen şehir',country:'Yapım ülkesi',directorOrigin:'Yönetmen nereli',reason:'Nasıl keşfettim / neden izledim',done:'Bitirildi mi?',category:'Kategori',feeling:'His',creator:'Creator / showrunner'};
const NAV=[['home','Ana sayfa'],['films','Filmler'],['series','Diziler'],['books','Kitaplar'],['concerts','Konserler'],['favs','Favoriler'],['lists','Playlistler']];
/* Playlist siralama sirası: ana liste once, sonra versucher II, artist, genre. */
const PLAYLIST_CATEGORY_ORDER=['main','versucher II','artist','genre'];

const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\r/g,'').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
const missing=s=>{const v=clean(s);return !v||/^[-–—]+$/.test(v)};
const trFormat=n=>Number.isFinite(n)?String(n).replace('.',','):'';
const isLocal=location.protocol==='file:';
function detectAppBase(){
  if(isLocal)return '';
  const parts=location.pathname.split('/').filter(Boolean);
  /* Bu liste, depo adini (orn. /arsiv) rotanin basindan ayirmak icin gereklidir.
     ROUTE_PREFIX ve sayfa adlari tutulmali; aksi halde /arsiv/playlist/... 404 sonrasi bozulur. */
  const known=[...Object.values(ROUTE_PREFIX),'films','series','books','concerts','favs','lists','etiket','tur','ara']
    .map(part=>part.toLocaleLowerCase('tr-TR'));
  const routeIndex=parts.findIndex(part=>known.includes(part.toLocaleLowerCase('tr-TR')));
  if(routeIndex===0)return '/';
  if(routeIndex>0)return '/'+parts.slice(0,routeIndex).join('/')+'/';
  const last=parts[parts.length-1]||'';
  if(last.includes('.'))return '/'+parts.slice(0,-1).join('/')+(parts.length>1?'/':'');
  /* Depo altinda yayin (orn. https://<kullanici>.github.io/arsiv/): ilk segment depo adidir. */
  return parts.length?'/'+parts.join('/')+'/':'/';
}
const APP_BASE=detectAppBase();
const main=$('#main');

function numberValue(value){
  const m=clean(value).match(/[+-]?\d+(?:[.,]\d+)?/);
  return m?Number(m[0].replace(',','.')):null;
}
function integerValue(value){const n=numberValue(value);return n==null?null:Math.round(n)}
function yearValue(value){const m=clean(value).match(/(?:18|19|20|21)\d{2}/);return m?Number(m[0]):null}
function stars(value){
  const n=numberValue(value);if(n==null)return '';
  const half=Math.round(n)/2,full=Math.floor(half),rest=half-full;
  return '★'.repeat(full)+(rest>=.4?'½':'');
}
function scoreHtml(item){
  return item.score==null?'—':`<span class="stars">${esc(stars(item.score))}</span>`;
}
function splitList(value){
  return clean(value).split(/\s*(?:\/\/|,|;)\s*/).map(clean).filter(v=>!missing(v));
}
function safeUrl(value){
  const v=clean(value);
  if(/^https?:\/\//i.test(v))return v;
  if(/^\/\//.test(v))return 'https:'+v;
  if(/^(?:www\.|themoviedb\.org\/)/i.test(v))return 'https://'+v;
  if(/^(?:\.{0,2}\/)/.test(v))return v;
  return '';
}
function slugPart(value){
  let s=clean(value).toLocaleLowerCase('tr-TR');
  const map={'ğ':'g','Ğ':'g','ı':'i','İ':'i','ö':'o','Ö':'o','ç':'c','Ç':'c','ş':'s','Ş':'s','ü':'u','Ü':'u','ø':'o','æ':'ae','œ':'oe','ß':'ss','ð':'d','þ':'th','ł':'l','đ':'d','³':'3','²':'2'};
  s=s.replace(/[ğĞıİöÖçÇşŞüÜøæœßðþłđ³²]/g,c=>map[c]).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[’'`´]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return s;
}
function filmName(item){
  const pre=clean(item.pre),title=clean(item.title);
  if(pre&&!title.toLocaleLowerCase('tr-TR').startsWith((pre+' ').toLocaleLowerCase('tr-TR')))return pre+' '+title;
  return title||pre;
}
function displayName(item){return item.sec==='films'?filmName(item):clean(item.title)}
function dateSort(value){
  const s=clean(value).toLocaleLowerCase('tr-TR');
  const months={ocak:0,şubat:1,subat:1,mart:2,nisan:3,mayıs:4,mayis:4,haziran:5,temmuz:6,ağustos:7,agustos:7,eylül:8,eylul:8,ekim:9,kasım:10,kasim:10,aralık:11,aralik:11};
  let m=s.match(/(\d{1,2})\s+([a-zçğıöşü]+)\s+(\d{4})/i);
  if(m&&months[m[2]]!=null)return Date.UTC(Number(m[3]),months[m[2]],Number(m[1]));
  /* 13.06.2026 -> gun/ay/yil. Film sayfasindaki "izleme tarihi" bu bicimde. */
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if(m)return Date.UTC(Number(m[3]),Number(m[2])-1,Number(m[1]));
  m=s.match(/(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?/);
  if(m)return Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]||1));
  const y=yearValue(s);return y?Date.UTC(y,0,1):-Infinity;
}

 * Veri katmanı

const PAGE_SIZE=30;
let sentinelObserver=null;
function totalPages(total){return Math.max(1,Math.ceil(total/PAGE_SIZE))}
function pagerHtml(total,view,current){
  const pages=totalPages(total);
  if(pages<2)return '';
  const parts=[];
  const add=p=>parts.push(p===current
    ?`<span class="pager-cur" aria-current="page">${p}</span>`
    :`<a href="${esc(hrefFor('/'+view+'/'+p))}" data-route="/${view}/${p}">${p}</a>`);
  for(let p=1;p<=pages;p++)add(p);
  return `<nav class="pager" aria-label="Sayfalar">${parts.join('')}</nav>`;
}
/* Liste sonuna gelindiginde sonraki 30 kayit eklenir. */
function armSentinel(kind,pages){
  const el=$('#grid-sentinel');
  if(!el)return;
  if(sentinelObserver){sentinelObserver.disconnect();sentinelObserver=null}
  if(state.page>=pages||typeof IntersectionObserver!=='function')return;
  sentinelObserver=new IntersectionObserver(entries=>{
    if(!entries.some(entry=>entry.isIntersecting))return;
    state.page++;fillGrid(kind);
  },{rootMargin:'800px'});
  sentinelObserver.observe(el);
}
let dataMeta={generatedAt:'',error:''};

/* JSON'dan gelen kayıtta türetilmiş alanları hesaplar. */
function hydrate(item){
  item.genres=Array.isArray(item.genres)?item.genres:[];
  item.subgenres=Array.isArray(item.subgenres)?item.subgenres:[];
  item.directors=Array.isArray(item.directors)?item.directors:[];
  item.countries=Array.isArray(item.countries)?item.countries:[];
  item.displayTitle=displayName(item);
  item.searchText=[
    item.displayTitle,item.author,item.originalTitle,item.seriesName,item.mainLabel,item.reason,item.platform,
    item.directorRaw,item.category,item.character,item.translator,item.publisher,item.formats,item.acquisition,
    item.authorOrigin,item.city,item.readLanguage,item.writtenLanguage,item.firstCity,item.directorOrigin,
    item.watched,item.seriesOrder,item.creator,item.network,item.format,item.statusRaw,item.category,item.feeling,
    item.countries.join(' '),item.genres.join(' '),item.subgenres.join(' ')
  ].filter(Boolean).join(' ').toLocaleLowerCase('tr-TR');
  return item;
}
function applyData(next,meta){
  const all=[];
  Object.keys(D).forEach(type=>{D[type]=next[type]||[]});
  Object.values(D).flat().forEach(item=>{hydrate(item);all.push(item)});
  REG=new Map(all.map(item=>[item.id,item]));
  dataMeta=meta||{generatedAt:'',error:''};
  render();
}
function totalCount(){return Object.values(D).reduce((sum,list)=>sum+list.length,0)}
function formatStamp(value){
  if(!value)return '';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '';
  try{return date.toLocaleString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).toLocaleLowerCase('tr-TR')+' (tsi)'}
  catch(_){return date.toISOString()}
}
function updateStatus(){
  const total=totalCount();
  const el=$('#data-status');
  if(el){
    el.textContent=dataMeta.error||(total?`${total.toLocaleString('tr-TR')} kayıt`:'Veri yükleniyor…');
    el.classList.toggle('is-error',!!dataMeta.error);
  }
  const foot=$('#data-footer');
  if(!foot)return;
  const files=Object.values(DATA_FILES).map(file=>file.split('/').pop()).join(' · ');
  if(dataMeta.error){foot.textContent=dataMeta.error;return}
  const stamp=formatStamp(dataMeta.generatedAt);
  if(!total){foot.textContent=files;return}
  foot.textContent=`Son güncelleme tarihi: ${stamp||'—'}`;
}
async function loadData(){
  const types=Object.keys(DATA_FILES);
  const results=await Promise.all(types.map(async type=>{
    const controller=typeof AbortController==='function'?new AbortController():null;
    const timer=controller?setTimeout(()=>controller.abort(),20000):null;
    try{
      const options={cache:'no-store'};if(controller)options.signal=controller.signal;
      const response=await fetch(DATA_FILES[type],options);
      if(!response.ok)throw new Error('HTTP '+response.status);
      const payload=await response.json();
      if(!payload||!Array.isArray(payload.items))throw new Error('beklenen biçimde değil');
      return {type,items:payload.items,generatedAt:clean(payload.generatedAt),ok:true};
    }catch(error){return {type,message:error&&error.message?error.message:String(error),ok:false}}
    finally{if(timer)clearTimeout(timer)}
  }));
  const next={films:[],series:[],books:[],playlists:[]};
  const failed=[];
  let newest='';
  results.forEach(result=>{
    if(!result.ok){failed.push(`${result.type} (${result.message})`);return}
    next[result.type]=result.items;
    if(result.generatedAt&&(!newest||result.generatedAt>newest))newest=result.generatedAt;
  });
  if(failed.length===types.length){
    dataMeta={generatedAt:'',error:isLocal
      ?'Veri okunamadı: siteyi dosya olarak (file://) açmayın — data/ klasöründen okumak için bir HTTP sunucusu gerekir.'
      :'Veri dosyaları yüklenemedi — '+failed.join('; ')};
    render();
    return;
  }
  applyData(next,{generatedAt:newest,error:failed.length?`Bazı veri dosyaları okunamadı — ${failed.join('; ')}`:''});
}

/* SPA yönlendirme: yayınlanmış sitede adres /kitap/... olur; file: altında hash kullanılır. */
function hrefFor(path){
  if(isLocal)return '#'+path;
  return APP_BASE+String(path).replace(/^\//,'');
}
function parseRoute(){
  let pathname=location.pathname;
  if(!isLocal&&APP_BASE&&pathname.toLocaleLowerCase('tr-TR').startsWith(APP_BASE.toLocaleLowerCase('tr-TR'))){
    pathname='/'+pathname.slice(APP_BASE.length);
  }
  let raw=isLocal&&location.hash?location.hash.slice(1):pathname;
  raw=raw.split('?')[0].split('#')[0];
  let parts;
  try{parts=raw.split('/').filter(Boolean).map(part=>decodeURIComponent(part))}catch(_){parts=raw.split('/').filter(Boolean)}
  const first=parts[0]?.toLocaleLowerCase('tr-TR');
  const routeType=Object.keys(ROUTE_PREFIX).find(key=>ROUTE_PREFIX[key]===first);
  if(routeType&&parts[1]?.toLocaleLowerCase('tr-TR')==='filtre'&&parts[2]&&parts[3])return {kind:'filter',type:routeType,field:parts[2],valueSlug:parts.slice(3).join('/')};
  if(routeType&&parts[1])return {kind:'detail',type:routeType,slug:parts.slice(1).join('/')};
  if(first==='etiket'&&parts[1])return {kind:'tag',slug:parts.slice(1).join('/')};
  if(first==='tur'&&parts[1])return {kind:'genre',slug:parts.slice(1).join('/')};
  if(first==='ara')return {kind:'search'};
  if(['films','series','books','concerts','favs','lists'].includes(first)){
    const page=Number(parts[1]);
    return {kind:'view',view:first,page:Number.isInteger(page)&&page>0?page:1};
  }
  return {kind:'view',view:'home'};
}
function resetFilters(){state.q='';state.sort='date';state.min=0;state.genre='';state.status='';state.cat='';state.page=1}
function navigate(path,replace=false){
  const target=isLocal?'#'+path:hrefFor(path);
  try{history[replace?'replaceState':'pushState']({},'',target)}catch(_){if(isLocal)location.hash=path;else location.href=target}
  state.route=parseRoute();resetFilters();render();window.scrollTo(0,0);
}
function go(view){navigate(view==='home'?'/' :`/${view}`)}
function hrefForView(view){return hrefFor(view==='home'?'/' :`/${view}`)}

function pal(value){let h=0;for(const c of clean(value))h+=c.charCodeAt(0);return `pal${h%6}`}
function imageFrame(item,large=false){

  return `<div class="cover ${pal(displayName(item))} ${image?'has-image':''} ${large?'large':''}">${fallback}${image?`<img src="${esc(image)}" alt="${esc(displayName(item))}" loading="${large?'eager':'lazy'}" decoding="async">`:''}</div>`;

function poster(item){

}

/** Anasayfa playlist satiri: "main" kategorisinden elle secilen 12 kayit, sirayla. */
function homePlaylistItems(){
  const byKey=new Map();
  for(const item of D.playlists||[]){
    if(looseKey(item.category)!=='main')continue;
    const key=looseKey(item.title);
    if(!byKey.has(key))byKey.set(key,item);
  }
  return HOME_PLAYLISTS.map(name=>byKey.get(looseKey(name))).filter(Boolean);

}
function sortItems(list,how){
  const a=[...list];
  const score=x=>x.score==null?-1:x.score;
  const year=x=>x.yearNumber==null?-1:x.yearNumber;
  const dateOf=x=>dateSort(x.sec==='books'?x.firstReadDate:x.watchDate);
  const recent=(x,y)=>{
    const dx=dateOf(x),dy=dateOf(y);
    if(dx===dy)return y.rowIndex-x.rowIndex;
    if(dx===-Infinity)return 1;
    if(dy===-Infinity)return -1;
    return dy-dx;
  };
  const yearCompare=(x,y,ascending=false)=>{
    const dx=year(x),dy=year(y);
    if(dx===dy)return y.rowIndex-x.rowIndex;
    if(dx<0)return 1;
    if(dy<0)return -1;
    return ascending?dx-dy:dy-dx;
  };
  if(how==='date')a.sort(recent);
  else if(how==='r')a.sort((x,y)=>score(y)-score(x)||recent(x,y));
  else if(how==='year')a.sort((x,y)=>yearCompare(x,y));
  else if(how==='yearasc')a.sort((x,y)=>yearCompare(x,y,true));
  else if(how==='title')a.sort((x,y)=>displayName(x).localeCompare(displayName(y),'tr'));
  else if(how==='category'){
    const rank=x=>{
      const key=looseKey(x.category);
      const i=PLAYLIST_CATEGORY_ORDER.findIndex(name=>looseKey(name)===key);
      return i<0?PLAYLIST_CATEGORY_ORDER.length:i;
    };
    a.sort((x,y)=>rank(x)-rank(y)||displayName(x).localeCompare(displayName(y),'tr'));
  }
  else if(how==='author')a.sort((x,y)=>clean(x.author).localeCompare(clean(y.author),'tr')||year(x)-year(y));
  else if(how==='tracks')a.sort((x,y)=>(y.tracks||0)-(x.tracks||0)||displayName(x).localeCompare(displayName(y),'tr'));
  return a;
}
const VIEW_TYPE={lists:'playlists'};
function dataType(view){return VIEW_TYPE[view]||view}
function genresFor(kind){return unique((D[kind]||[]).flatMap(item=>item.genres))}
function gridView(kind){
  const cfg=CFG[kind],type=dataType(kind),genres=genresFor(type);
  const options=type==='playlists'
    ?[['category','Kategoriye göre'],['tracks','Şarkı sayısına göre'],['title','Ada göre']]
    :[['date',type==='books'?'İlk okunma tarihine göre':type==='films'?'Son izlemeye göre':'Tarihe göre'],['r','Puana göre'],['year','Yıla göre (yeniden eskiye)'],['yearasc','Yıla göre (eskiden yeniye)'],['title','Ada göre']];
  if(type==='books')options.push(['author','Yazara göre']);
  const cats=type==='playlists'?unique((D.playlists||[]).map(item=>item.category)):[];
  main.innerHTML=`<h1>${cfg.label}</h1><p class="sub" id="count"></p><div class="ctl"><input id="q" type="search" placeholder="${cfg.label} içinde ara" aria-label="Ara" value="${esc(state.q)}"><select id="sort" aria-label="Sırala">${options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}</select>${genres.length?`<select id="genre" aria-label="Tür"><option value="">Tüm türler</option>${genres.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('')}</select>`:''}${kind==='series'?`<select id="status" aria-label="Durum"><option value="">Tüm durumlar</option><option value="done">Bitirdiklerim</option><option value="part">Bitirmadiklerim</option><option value="ongoing">Sürüyor</option></select>`:''}${type==='playlists'?`<select id="cat" aria-label="Kategori"><option value="">Tüm kategoriler</option>${cats.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('')}</select>`:''}<select id="min" aria-label="En düşük puan"><option value="0">Tüm puanlar</option><option value="8">8 ve üstü</option><option value="9">9 ve üstü</option><option value="10">10</option></select></div><div id="grid" class="grid"></div><div id="pager"></div><div id="grid-sentinel" class="grid-sentinel" aria-hidden="true"></div>`;
  if(!options.some(pair=>pair[0]===state.sort))state.sort=options[0][0];
  $('#sort').value=state.sort;if($('#min'))$('#min').value=String(state.min);if($('#genre'))$('#genre').value=state.genre;if($('#status'))$('#status').value=state.status;if($('#cat'))$('#cat').value=state.cat;
  if(type==='playlists'){const ctl=$('#min');if(ctl)ctl.remove()}
  fillGrid(kind);
}
function fillGrid(kind){
  const q=clean(state.q).toLocaleLowerCase('tr-TR');
  const type=dataType(kind),cfg=cfgOf(kind);
  let list=(D[type]||[]).filter(item=>(!q||item.searchText.includes(q))&&(!state.genre||item.genres.includes(state.genre))&&(!state.cat||item.category===state.cat)&&(!state.min||item.score>=state.min)&&(!state.status||(state.status==='done'?item.done:state.status==='ongoing'?item.ongoing:!item.done)));
  list=sortItems(list,state.sort);
  const total=list.length,pages=totalPages(total);
  if(state.page>pages)state.page=pages;
  const shown=list.slice(0,state.page*PAGE_SIZE);
  $('#count').textContent=`${total.toLocaleString('tr-TR')} ${cfgOf(kind).unit}`;
  $('#grid').innerHTML=shown.length?shown.map(poster).join(''):'<p class="empty">Bu filtreyle eşleşen kayıt yok.</p>';
  const pager=$('#pager');
  if(pager)pager.innerHTML=pagerHtml(total,kind,state.page);
  armSentinel(kind,pages);
}

  const turler=(typeRows+allRow+labelRow)?`<section><h2>Türler</h2>${typeRows}${allRow}${labelRow}</section>`:'';
  const muzik=group('Müzik türleri',byKind.playlists,value=>filterPath('playlists','genre',value));
  main.innerHTML=`<h1>Favoriler</h1><p class="sub">Veri kayıtlarından otomatik oluşturulan özetler. Sayılar en çok olandan en aza sıralıdır ve o türdeki gerçek kayıt adedini gösterir; bağlantıya tıklayınca o kişinin ya da türün kayıtları listelenir.</p><div class="favs" style="margin-top:1.5rem">${group('Yazarlar',authors,value=>filterPath('books','author',value))}${group('Yönetmenler',directors,value=>filterPath('films','director',value))}${turler}${muzik}</div>`;
}
function placeholderView(kind){
  const isConcerts=kind==='concerts';
  main.innerHTML=`<h1>${CFG[kind].label}</h1><div class="placeholder" style="margin-top:1.5rem"><h2>${isConcerts?'Konserler yakında':'Playlistler yakında'}</h2><p>${isConcerts?'Konser veri tablosu eklenince afişler ve kişisel konser sayfaları burada açılacak.':'Playlist veri tablosu eklenince liste sayfaları burada açılacak.'}</p></div>`;
}
function viewKey(type){return type==='playlists'?'lists':type}
function cfgOf(type){return CFG[viewKey(type)]||CFG[type]||{label:type,unit:type}}
function nav(){
  const current=(state.route.kind==='detail'||state.route.kind==='filter')?viewKey(state.route.type):(state.route.view||'');
  $('#nav').innerHTML=NAV.map(([key,label])=>`<a href="${esc(hrefForView(key))}" data-route="${key==='home'?'/':`/${key}`}" ${current===key?'aria-current="page"':''}>${label}</a>`).join('');
}
function render(){
  updateStatus();nav();
  if(state.route.kind==='detail'){
    const item=REG.get(`${state.route.type}:${state.route.slug}`);
    if(item){document.title=displayName(item)+' — versucher';detailPage(item)}else{document.title='Kayıt bulunamadı — versucher';notFound(state.route.slug)}
    return;
  }
  if(state.route.kind==='filter'){filterPage(state.route);return}
  if(state.route.kind==='tag'){tagPage(state.route);return}
  if(state.route.kind==='genre'){genrePage(state.route);return}
  if(state.route.kind==='search'){state.q=searchQuery();searchPage();return}
  if(state.route.kind==='view')state.page=state.route.page||1;
  document.title=CFG[state.route.view]?.label?CFG[state.route.view].label+' — versucher':'versucher';
  if(state.route.view==='home')home();
  else if(['films','series','books','lists'].includes(state.route.view))gridView(state.route.view);
  else if(state.route.view==='favs')favoritesView();
  else placeholderView(state.route.view);
}

const root=document.documentElement;
function currentTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function themeLabel(){$('#theme').textContent=currentTheme()==='dark'?'Açık tema':'Koyu tema'}
try{const saved=localStorage.getItem('theme');if(saved)root.dataset.theme=saved}catch(_){}
$('#theme').addEventListener('click',()=>{const next=currentTheme()==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('theme',next)}catch(_){}themeLabel()});
themeLabel();

document.addEventListener('click',event=>{
  const route=event.target.closest('[data-route]');
  if(route&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey){event.preventDefault();navigate(route.dataset.route);return}
});
document.addEventListener('input',event=>{
  if(event.target.id==='q'){state.q=event.target.value;state.page=1;fillGrid(state.route.view);return}
  if(event.target.id==='sq'){
    state.q=event.target.value;
    const found=searchSections(state.q);
    const box=$('#search-results'),info=$('#search-info');
    if(box)box.innerHTML=found.html||(String(state.q).trim()?'<p class="empty">Bu sorguyla eşleşen kayıt yok.</p>':'');
    if(info)info.innerHTML=searchInfo(state.q,found.total);
    /* Adresi güncelle ki arama paylaşılabilir olsun; sayfa yeniden yüklenmesin.
       Yerelde rota hash'in içinde olduğu için korunur, yoksa rota kaybolur. */
    const q=String(state.q).trim();
    const base=isLocal?location.pathname+(location.hash||'').split('?')[0]:location.pathname;
    try{history.replaceState({},'',q?`${base}?q=${encodeURIComponent(q)}`:base)}catch(_){}
  }
});
/* "/" tusu aramayi acar; alan bos degilse sayfa ici arama kutusuna odaklanir. */
document.addEventListener('keydown',event=>{
  if(event.key!=='/'||event.metaKey||event.ctrlKey||event.altKey)return;
  const tag=(event.target&&event.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(event.target&&event.target.isContentEditable))return;
  event.preventDefault();
  if(state.route.kind==='search'){const input=$('#sq');if(input){input.focus();input.select()}return}
  navigate('/ara');
});
document.addEventListener('change',event=>{
  if(!event.target.id)return;
  if(event.target.id==='sort')state.sort=event.target.value;
  else if(event.target.id==='min')state.min=Number(event.target.value);
  else if(event.target.id==='genre')state.genre=event.target.value;
  else if(event.target.id==='status')state.status=event.target.value;
  else if(event.target.id==='cat')state.cat=event.target.value;
  else return;
  state.page=1;fillGrid(state.route.view);
});
document.addEventListener('error',event=>{
  const image=event.target;
  if(image instanceof HTMLImageElement&&image.closest('.cover')){image.remove();image.closest('.cover')?.classList.remove('has-image')}
},true);
function routeSignature(route){return [route.kind,route.type||'',route.view||'',route.page||'',route.slug||'',route.field||'',route.valueSlug||''].join('|')}
function syncFromLocation(){
  const next=parseRoute();
  if(routeSignature(next)===routeSignature(state.route))return;
  state.route=next;resetFilters();render();
}
window.addEventListener('popstate',syncFromLocation);
window.addEventListener('hashchange',syncFromLocation);

updateStatus();
loadData();
</script>
</body>
</html>
